<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Stock Terminal v3.9 - Multi-chart / Backtest / Wizard</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060A12;--bg2:#0B1220;--bg3:#111B2E;--bg4:#162240;
  --border:#1A2740;--bhi:#2A3D5C;
  --gold:#F5C518;--gold-s:rgba(245,197,24,.08);--gold-m:rgba(245,197,24,.18);
  --text:#C8D3E0;--thi:#F1F5FA;--tlo:#5A6A82;--tf:#2D3A52;
  --green:#4ADE80;--gbg:rgba(74,222,128,.08);--gbdr:rgba(74,222,128,.3);
  --blue:#60A5FA;--bbg:rgba(96,165,250,.08);--bbdr:rgba(96,165,250,.3);
  --red:#F87171;--cyan:#67E8F9;--orange:#FB923C;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif TC','PingFang TC',serif;overflow:hidden}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{height:42px;background:rgba(11,18,32,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;z-index:50}
#wlbar{height:64px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:stretch;gap:0;padding:0 4px;flex-shrink:0;overflow:hidden}
#wlchips{display:grid;grid-template-rows:repeat(2,1fr);grid-auto-flow:column dense;grid-auto-columns:max-content;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;align-items:stretch}
/* 市場分排：上排 TW、下排 US（避免兩種市場混在一欄）*/
.wlchip[data-mkt="TW"]{grid-row:1}
.wlchip[data-mkt="US"]{grid-row:2}
#wlchips::-webkit-scrollbar{height:2px}
#body{display:flex;flex:1;min-height:0}
#left{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
#chartarea{flex:1;min-height:0;position:relative;background:var(--bg)}
#indbar{background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;padding:0;overflow:hidden;flex-shrink:0}
#right{flex:0 0 40%;width:40%;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--bg2)}
#left{min-width:0}
#splitter{display:none}
#rtabs{display:flex;border-bottom:1px solid var(--border);height:36px;flex-shrink:0}
#rpanel{flex:1;overflow-y:auto;min-height:0}

/* ── TOP BAR ── */
.logo{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:2px;white-space:nowrap}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
#syminput{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:4px 9px;color:var(--thi);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2px;width:100px;outline:none;text-transform:uppercase}
#syminput:focus{border-color:var(--gold)}
.mktbtn{padding:4px 9px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;transition:all .12s}
.mktbtn.on{background:var(--gold-s);border-color:var(--gold-m);color:var(--gold);font-weight:700}
#gobtn{padding:4px 14px;background:var(--gold);color:#060A12;border:none;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:1px}
#gobtn:hover{background:#FBBF24}
#gobtn:disabled{opacity:.4;cursor:not-allowed}
#keybtn{padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer;margin-left:auto}
#keybtn:hover{color:var(--text);border-color:var(--bhi)}
#statusbar{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tlo);letter-spacing:1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.5s ease infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── WATCHLIST BAR ── */
.wlchip{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:32px;cursor:pointer;border-right:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap;transition:background .12s,box-shadow .12s;flex-shrink:0;line-height:1;position:relative;user-select:none}
.wlchip:hover{background:var(--bg3)}
.wlchip.active{background:var(--gold-s)}
.wlchip-t{color:var(--thi);font-weight:700;letter-spacing:.5px}
.wlchip.active .wlchip-t{color:var(--gold)}
.wlchip-p{font-size:10px}
.wlchip-rm{color:var(--tf);font-size:13px;margin-left:1px;padding:0 4px;border-radius:3px;opacity:0;transition:opacity .12s;cursor:pointer;line-height:1}
.wlchip:hover .wlchip-rm{opacity:.7}
.wlchip-rm:hover{color:var(--red);background:rgba(248,113,113,.12);opacity:1!important}
.wlchip.dragging{opacity:.35}
.wlchip.drop-before{box-shadow:inset 3px 0 0 var(--gold)}
.wlchip.drop-after{box-shadow:inset -3px 0 0 var(--gold)}
.wlchip-grip{display:inline-block;color:var(--tf);font-size:9px;margin-right:1px;cursor:grab;letter-spacing:-1px}
.wlchip:hover .wlchip-grip{color:var(--tlo)}
.wlchip[draggable=true]:active{cursor:grabbing}
.pos{color:var(--green)}.neg{color:var(--red)}.flat{color:var(--tlo)}
.wladd{padding:0 12px;height:64px;background:transparent;border:none;color:var(--tlo);cursor:pointer;font-size:18px;flex-shrink:0;border-left:1px solid var(--border)}
.wladd:hover{color:var(--gold)}

/* ── RANGE BAR (iOS-style chart range selector) ── */
#rangebar{height:30px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:stretch;padding:0;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
#rangebar::-webkit-scrollbar{height:2px}
.rgbtn{flex:1 1 0;min-width:54px;background:transparent;border:none;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;cursor:pointer;border-right:1px solid var(--border);transition:all .12s;padding:0 6px;white-space:nowrap}
.rgbtn:last-child{border-right:none}
.rgbtn:hover{color:var(--thi);background:var(--bg3)}
.rgbtn.on{color:var(--gold);background:var(--gold-s);box-shadow:inset 0 -2px 0 var(--gold)}

/* ── CHART AREA ── */
#chart-wrap{position:absolute;top:0;left:0;right:0;bottom:0}
#chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tlo);letter-spacing:2px}
#chart-info{position:absolute;top:8px;left:10px;z-index:5;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tlo);pointer-events:none}
.ci-price{font-size:18px;font-weight:700;color:var(--thi);letter-spacing:1px}
#ci-ohlc{display:none;margin-top:3px;padding:2px 7px;background:rgba(11,18,32,.7);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:9px;line-height:1.45;letter-spacing:.2px;backdrop-filter:blur(4px);white-space:nowrap;max-width:none}
#ci-ohlc .ohlc-d{color:var(--tlo);margin-right:8px}
#ci-ohlc .ohlc-k{color:var(--tlo);margin-right:1px}
#ci-ohlc .ohlc-v{font-weight:700;margin-right:8px}
#ci-ohlc .ma-row{font-size:9px;color:var(--tlo);margin-top:3px}
#ci-ohlc .ma-row span{margin-right:8px}
.ci-chg{font-size:11px;margin-top:2px}

/* ── INDICATOR BAR (16 cells in 8-col × 2-row grid, no scroll) ── */
.ig{display:grid;grid-template-rows:repeat(2,34px);grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.igcell{padding:2px 8px;border-right:1px solid var(--border);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px;overflow:hidden;min-width:0}
.igcell:nth-child(odd){border-top:none}
.ig-lbl{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--tlo);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.ig-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--thi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;flex-shrink:0}

/* ── RIGHT PANEL TABS ── */
.rtab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;height:36px;letter-spacing:1px;transition:all .12s}
.rtab:hover{color:var(--text)}
.rtab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--gold-s)}

/* ── STATS TAB ── */
.stat-hdr{padding:10px 12px 6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tlo);letter-spacing:2px;border-bottom:1px solid var(--border)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px}
.stat-row:last-child{border-bottom:none}
.stat-k{color:var(--tlo)}
.stat-v{color:var(--thi);font-weight:700}
.stat-sect{padding:6px 12px;background:var(--bg);font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--tf);letter-spacing:2px;border-bottom:1px solid var(--border);text-transform:uppercase}

/* ── RESEARCH TAB ── */
#anabtn{display:block;width:calc(100% - 24px);margin:10px 12px;padding:9px;background:var(--gold);color:#060A12;border:none;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px}
#anabtn:hover:not(:disabled){background:#FBBF24}
#anabtn:disabled{opacity:.4;cursor:not-allowed}
#anapanel{padding:0 12px 12px;font-size:12px;line-height:1.8;color:var(--text)}
.toc-pills{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border)}
.tpill{padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tlo);cursor:pointer;transition:all .12s}
.tpill:hover{color:var(--text);border-color:var(--bhi)}
.tpill.on{background:var(--gold-s);border-color:var(--gold-m);color:var(--gold)}
.asec{padding:12px 0;border-bottom:1px dashed var(--border)}
.asec:last-child{border-bottom:none}
.asec-hdr{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;padding:2px 7px;background:var(--gold-s);border-left:2px solid var(--gold)}
.asec-body p{margin:4px 0;font-size:12px}
.asec-body strong{color:var(--thi)}
.asec-body table{width:100%;border-collapse:collapse;font-size:10px;font-family:'JetBrains Mono',monospace;margin:6px 0}
.asec-body th{background:var(--bg);color:var(--gold);padding:5px 7px;text-align:left;border-bottom:1px solid var(--border);font-size:9px}
.asec-body td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.asec-body ul{padding-left:14px;margin:4px 0}
.asec-body li{margin:2px 0}
.asec-body li::marker{color:var(--gold)}
.asec-body code{background:var(--bg);padding:1px 4px;border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan)}
.stream-box{padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tlo);white-space:pre-wrap;word-break:break-word;animation:blink-cur 1s step-end infinite}
@keyframes blink-cur{50%{opacity:.5}}
.src-box{padding:8px 12px;border-top:1px solid var(--border)}
.src-ttl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cyan);letter-spacing:2px;margin-bottom:5px}
.src-lnk{display:block;font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;opacity:.7}
.src-lnk:hover{opacity:1}
.phase-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tlo);margin:0 12px 6px}

/* ── BATCH TAB ── */
.batch-input-row{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
#batchsym{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 8px;color:var(--thi);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;outline:none;text-transform:uppercase}
#batchsym:focus{border-color:var(--gold)}
.badd{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.badd:hover{color:var(--text);border-color:var(--bhi)}
.brun{padding:5px 10px;background:var(--gold);color:#060A12;border:none;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer}
.brun:disabled{opacity:.4;cursor:not-allowed}
.batch-list{padding:6px 12px;display:flex;flex-direction:column;gap:4px}
.batch-item{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px}
.bi-sym{color:var(--thi);font-weight:700;min-width:60px;letter-spacing:1px}
.bi-st{color:var(--tlo);flex:1;font-size:9px}
.bi-st.done{color:var(--green)}.bi-st.err{color:var(--red)}.bi-st.running{color:var(--gold)}
.bi-x{background:none;border:none;color:var(--tf);cursor:pointer;font-size:12px;padding:0 2px}
.bi-x:hover{color:var(--red)}
.bmkt{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:700}
.bmkt.tw{background:var(--gbg);color:var(--green)}.bmkt.us{background:var(--bbg);color:var(--blue)}

/* ── HISTORY TAB ── */
.hist-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.hist-item:hover{background:var(--bg3)}
.hi-t{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--gold);min-width:55px;letter-spacing:1px}
.hi-mkt{font-family:'JetBrains Mono',monospace;font-size:8px;padding:1px 5px;border-radius:2px;font-weight:700}
.hi-mkt.tw{background:var(--gbg);color:var(--green)}.hi-mkt.us{background:var(--bbg);color:var(--blue)}
.hi-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tlo);margin-left:auto}
.hi-x{background:none;border:none;color:var(--tf);cursor:pointer;font-size:13px;padding:0 3px}
.hi-x:hover{color:var(--red)}

/* ── MODALS ── */
.modal{position:fixed;inset:0;background:rgba(6,10,18,.85);z-index:100;display:flex;align-items:center;justify-content:center}
.mbox{background:var(--bg2);border:1px solid var(--bhi);border-radius:10px;padding:22px;width:380px;max-width:90vw}
.m-title{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.m-desc{font-size:11px;color:var(--tlo);line-height:1.7;margin-bottom:14px}
.m-row{display:flex;gap:8px}
.m-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--thi);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.m-input:focus{border-color:var(--gold)}
.m-btn{padding:8px 16px;background:var(--gold);color:#060A12;border:none;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer}
.m-btn-sec{padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--tlo);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.m-btn-sec:hover{color:var(--text);border-color:var(--bhi)}

/* ── PRINT ── */
@media print{
  @page{size:A4;margin:1.6cm 1.8cm}
  #app{height:auto;overflow:visible}
  #topbar,#wlbar,#indbar,#rtabs,#left,#keybtn{display:none!important}
  #body{display:block}
  #right{width:100%;border:none;background:#fff}
  #rpanel{overflow:visible}
  body,html{background:#fff;color:#000;overflow:visible}
  .asec-hdr{background:#fffbeb;border-color:#b8960c;color:#b8960c}
  .asec-body{color:#000}
  .asec-body strong{color:#000}
  .asec-body th{color:#b8960c}
  .asec-body td{color:#000}
  #anabtn,.toc-pills,#keybtn,.rtab{display:none!important}
}
</style>

<body>
<div id="app">
  <div id="topbar">
    <span class="logo" data-v2-banner>STOCK TERMINAL <span style="color:#FBBF24;font-size:9px;letter-spacing:1px;font-weight:700">v3.9</span></span>
    <div class="sep"></div>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="mktbtn on" id="btn-tw" onclick="setMkt('TW')">🇹🇼 TW</button>
      <button class="mktbtn" id="btn-us" onclick="setMkt('US')">🇺🇸 US</button>
    </div>
    <input id="syminput" placeholder="代號" maxlength="10" onkeydown="if(event.key==='Enter')go()">
    <button id="gobtn" onclick="go()">▶ GO</button>
    <div class="sep"></div>
    <div id="statusbar"><div class="pulse"></div><span id="stattxt">READY</span></div>
    <button id="keybtn" onclick="showKeyModal()">API KEY</button>
  </div>
  <div id="wlbar">
    <div id="wlchips"></div>
    <button class="wladd" onclick="addToWl()" title="加入自選">＋</button>
  </div>
  <div id="body">
    <div id="left">
      <div id="rangebar" role="tablist"></div>
      <div id="chartarea">
        <div id="chart-wrap"></div>
        <div id="chart-loading">載入中...</div>
        <div id="chart-info" style="display:none">
          <div class="ci-price" id="ci-price">--</div>
          <div class="ci-chg" id="ci-chg"></div>
          <div style="font-size:9px;color:var(--tlo);margin-top:3px" id="ci-name"></div>
          <div id="ci-ohlc"></div>
        </div>
      </div>
      <div id="indbar"><div class="ig" id="ig-cells"></div></div>
    </div>
    <div id="splitter" title="拖曳調整線型 / 功能區寬度"></div>
    <div id="right">
      <div id="rtabs">
        <button class="rtab on" onclick="setTab('stats')">STATS</button>
        <button class="rtab" onclick="setTab('research')">RESEARCH</button>
        <button class="rtab" id="tab-pos" onclick="setTab('position')">POS</button>
        <button class="rtab" id="tab-watch" onclick="setTab('watch')">WATCH</button>
        <button class="rtab" id="tab-plan" onclick="setTab('plan')">PLAN</button>
        <button class="rtab" id="tab-etf" onclick="setTab('etf')">ETF△</button>
      </div>
      <div id="rpanel"></div>
    </div>
  </div>

const WORKER_SRC = `
self.onmessage = function(e) {
  const {candles} = e.data;
  if (!candles || candles.length < 2) { self.postMessage({}); return; }
  const c = candles.map(x=>x.close);
  const h = candles.map(x=>x.high);
  const l = candles.map(x=>x.low);
  const v = candles.map(x=>x.volume||0);
  const n = c.length;
  function sma(arr,p){
    const r=[];
    for(let i=0;i<arr.length;i++){
      if(i<p-1){r.push(null);continue;}
      let s=0;for(let j=i-p+1;j<=i;j++)s+=arr[j];
      r.push(s/p);
    }
    return r;
  }
  function ema(arr,p){
    const r=[];const k=2/(p+1);
    for(let i=0;i<arr.length;i++){
      if(i===0){r.push(arr[0]);continue;}
      r.push(arr[i]*k+r[i-1]*(1-k));
    }
    return r;
  }
  const s5=sma(c,5),s20=sma(c,20),s60=sma(c,60);
  const cur=c[n-1];
  // RSI14
  let gains=0,losses=0;
  for(let i=n-14;i<n;i++){
    const d=c[i]-c[i-1];
    if(d>0)gains+=d;else losses-=d;
  }
  const avgG=gains/14,avgL=losses/14;
  const rsi14=avgL===0?100:(100-(100/(1+avgG/avgL)));
  // MACD
  const ema12=ema(c,12),ema26=ema(c,26);
  const macdLine=ema12[n-1]-ema26[n-1];
  const macdArr=ema12.map((v,i)=>v-ema26[i]);
  const signal9=ema(macdArr,9)[n-1];
  const macdHist=macdLine-signal9;
  // KD (stoch 9)
  const kp=9;
  const lo9=Math.min(...l.slice(n-kp)),hi9=Math.max(...h.slice(n-kp));
  const rsv=hi9===lo9?50:((cur-lo9)/(hi9-lo9))*100;
  const prevK=(n>1)?rsv:50,prevD=(n>1)?rsv:50;
  const K=prevK*2/3+rsv/3,D=prevD*2/3+K/3;
  // Bollinger 20
  const m20=s20[n-1];
  let variance=0;
  for(let i=n-20;i<n;i++)variance+=(c[i]-m20)**2;
  const std=Math.sqrt(variance/20);
  const bbU=m20+2*std,bbL=m20-2*std;
  // ATR14
  let atrSum=0;
  for(let i=n-14;i<n;i++){
    const tr=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));
    atrSum+=tr;
  }
  const atr14=atrSum/14;
  // AnnVol
  const rets=[];
  for(let i=Math.max(1,n-60);i<n;i++)rets.push(Math.log(c[i]/c[i-1]));
  const meanR=rets.reduce((a,b)=>a+b,0)/rets.length;
  const varR=rets.reduce((a,b)=>a+(b-meanR)**2,0)/rets.length;
  const annVol=(Math.sqrt(varR)*Math.sqrt(252)*100).toFixed(1);
  // MaxDD (60d)
  let peak=c[Math.max(0,n-60)],maxdd=0;
  for(let i=Math.max(1,n-60);i<n;i++){
    if(c[i]>peak)peak=c[i];
    const dd=(peak-c[i])/peak*100;
    if(dd>maxdd)maxdd=dd;
  }
  // VolRatio (5d vs 20d avg)
  const v5avg=v.slice(n-5).reduce((a,b)=>a+b,0)/5;
  const v20avg=v.slice(n-20).reduce((a,b)=>a+b,0)/20;
  const volRatio=v20avg>0?(v5avg/v20avg).toFixed(2):'-';
  // d2SMA20
  const d2=(cur&&m20)?(((cur-m20)/m20)*100).toFixed(2):null;
  self.postMessage({
    sma5:s5[n-1], sma20:m20, sma60:s60[n-1],
    rsi14:rsi14.toFixed(1),
    macd:macdLine.toFixed(3), macdSig:signal9.toFixed(3), macdHist:macdHist.toFixed(3),
    K:K.toFixed(1), D:D.toFixed(1),
    bbU:bbU.toFixed(2), bbL:bbL.toFixed(2), bbM:m20?m20.toFixed(2):null,
    atr14:atr14.toFixed(2),
    annVol, maxdd:maxdd.toFixed(1),
    volRatio, d2SMA20:d2,
  });
};
`;
const _workerBlob = new Blob([WORKER_SRC], {type:'application/javascript'});
const _workerURL  = URL.createObjectURL(_workerBlob);

function runWorker(candles) {
  return new Promise((res) => {
    const w = new Worker(_workerURL);
    w.onmessage = e => { w.terminate(); res(e.data); };
    w.onerror   = () => { w.terminate(); res({}); };
    w.postMessage({candles});
  });
}

async function fetchYF(sym, rangeDef) {
  rangeDef = rangeDef || currentRangeDef();
  const url = `${SERVER}/yf/${sym}?range=${rangeDef.range}&interval=${rangeDef.interval}`;
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error('server '+r.status);
    return await r.json();
  } catch {
    // allorigins fallback
    try {
      const yurl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=${rangeDef.interval}&range=${rangeDef.range}`;
      const fb = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(yurl)}`);
      const j = await fb.json();
      return JSON.parse(j.contents);
    } catch { return null; }
  }
}

async function fetchYFBatch(syms, rangeDef) {
  rangeDef = rangeDef || {range:'5d', interval:'1d'};   // batch uses short range by default (quick chip refresh)
  const url = `${SERVER}/yf/batch?syms=${syms.join(',')}&range=${rangeDef.range}&interval=${rangeDef.interval}`;
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (r.ok) return await r.json();
  } catch {}
  // fallback: serial
  const out = {};
  for (const s of syms) {
    const d = await fetchYF(s, rangeDef);
    if (d) out[s] = d;
  }
  return out;
}

function parseYF(raw) {
  try {
    const res = raw?.chart?.result?.[0];
    if (!res) return null;
    const q = (res.indicators?.quote?.[0]) || {};   // 盤中空資料時 Yahoo 可能無 indicators
    const ts = res.timestamp || [];                  // 空 → candles=[](回空而非丟例外)
    let candles = ts.map((t,i)=>({
      time: t,
      open:  q.open[i]  ?? q.close[i],
      high:  q.high[i]  ?? q.close[i],
      low:   q.low[i]   ?? q.close[i],
      close: q.close[i] ?? 0,
      volume: q.volume[i] ?? 0,
    })).filter(c=>c.close!=null&&c.close>0);
    // ── 日線異常驗證 (v3.9 Phase-0 護航) ──────────────────────────
    // 剔除「孤立尖刺」壞點:某根收盤較前後兩根皆 >40% 落差(且隨即回復)。
    // 跳空/漲跌停會「持續」(下一根接近壞值)故不會被誤刪;只殺立即回復的離群單根。
    // 防 Yahoo 偶發壞 tick 汙染線型/指標。保守門檻 40%(遠大於台股±10%漲跌停)。
    let _anomDropped = 0;
    if (candles.length >= 3) {
      const cleaned = [candles[0]];
      for (let i = 1; i < candles.length - 1; i++) {
        const a = candles[i-1].close, b = candles[i].close, c = candles[i+1].close;
        const hi = Math.max(a, c), lo = Math.min(a, c);
        if (b > hi * 1.4 || b < lo * 0.6) { _anomDropped++; continue; }
        cleaned.push(candles[i]);
      }
      cleaned.push(candles[candles.length - 1]);
      candles = cleaned;
    }
    if (_anomDropped) console.warn('[parseYF] 剔除', _anomDropped, '根異常日K(孤立尖刺)');
    const meta = res.meta;
    return {candles, meta, name: meta.longName||meta.shortName||meta.symbol||'', anomDropped: _anomDropped};
  } catch { return null; }
}

  setMktUI(mkt);
  if (!silent) {   // silent=當日自動刷新(liverefresh_v3),不閃「載入中」遮罩
    setStat('載入 '+sym+'...');
    document.getElementById('chart-loading').style.display='flex';
    document.getElementById('chart-info').style.display='none';
  }
  clearInd();

  // Build YF ticker（^ 開頭=指數，如 ^TWII/^GSPC/^SOX，原樣不加 .TW）
  const yfsym = (sym[0] === '^') ? sym : (mkt==='TW' ? sym+'.TW' : sym);
  let rdef = currentRangeDef();

  // ── 日線壞源護航 (v3.9 Phase-0) ──────────────────────────────
  // Yahoo 對某些指數(^TWOII 櫃買)各端點互斥、日線整段錯亂(419/269/105),
  // 且無可信日線歷史源 → 不畫假K。改抓 /quote(後端已改走 TWSE MIS 真值),
  // 在圖區顯示即時值與來源說明。即時值另見底部大盤列。
  const BAD_DAILY = ['^TWOII'];
  if (BAD_DAILY.includes(yfsym)) {
    let _tq = null;
    try { _tq = await fetch(`${SERVER}/quote/${encodeURIComponent(yfsym)}`, {cache:'no-store'}).then(r=>r.ok?r.json():null); } catch {}
    if (_myLoad !== window.__loadSeq) return;
    const _el = document.getElementById('chart-loading');
    _el.style.display = 'flex';
    const _pv = (_tq && _tq.price != null) ? _tq.price.toFixed(2) : '—';
    const _cp = (_tq && _tq.changePct != null) ? ((_tq.changePct>=0?'+':'')+_tq.changePct.toFixed(2)+'%') : '';
    _el.innerHTML = `<div style="text-align:center;line-height:1.7">⚠ ${sym} 無可信日線資料源<br>`
      + `<span style="color:var(--muted,#888);font-size:12px">(Yahoo 此指數日線錯亂,不顯示假K)</span><br>`
      + `即時值 <b>${_pv}</b> <span style="color:${(_tq&&_tq.changePct>=0)?'var(--green)':'var(--red)'}">${_cp}</span>`
      + `<br><span style="color:var(--muted,#888);font-size:12px">來源:${_tq?_tq.source:'—'}・另見底部大盤列</span></div>`;
    document.getElementById('chart-info').style.display = 'none';
    setStat(sym+'：無可信日線,僅即時值('+(_tq?_tq.source:'—')+')');
    return;
  }

  const raw = await fetchYF(yfsym, rdef);
  // 切股 race：若這次 fetch 期間使用者已切到別檔(更新的 loadSym)，丟棄這份舊資料不渲染
  if (_myLoad !== window.__loadSeq) return;
  let parsed = parseYF(raw);
  // ── 盤中分K空資料 → 自動退日線 (v3.9 修「9:00開盤抓不到K線」) ──────
  // Yahoo 台股開盤後常延遲提供當日 intraday(5m)bars,回空陣列→parseYF 無 candles。
  // 改:偵測到分K為空就自動改抓日線(日線會用 regularMarketPrice 合成今日K棒,
  // 至少看得到今天),而非顯示「載入失敗/無資料」。
  const _intradayDef = (rdef.interval !== '1d' && rdef.interval !== '1wk');
  let _noteMsg = '';
  // (1) 盤中分K Yahoo 開盤常延遲回空 → 用即時報價(/quote 真當日 open/high/low/現價)
  //     合成「今日K棒」,保留分鐘時間軸,看得到當日漲跌;配合 liverefresh_v3 每分鐘更新。
  if (_intradayDef && (!parsed || !parsed.candles.length)) {
    try {
      const _q = await fetch(`${SERVER}/quote/${encodeURIComponent(yfsym)}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
      if (_myLoad !== window.__loadSeq) return;   // 切股 race 守衛
      if (_q && _q.price > 0) {
        const _o = (_q.open > 0 ? _q.open : (_q.prevClose || _q.price));
        const _h = (_q.high > 0 ? _q.high : Math.max(_o, _q.price));
        const _l = (_q.low  > 0 ? _q.low  : Math.min(_o, _q.price));
        parsed = { candles: [{ time: Math.floor(Date.now() / 1000), open: _o, high: _h, low: _l, close: _q.price, volume: _q.volume || 0 }],
                   meta: { symbol: yfsym }, name: (parsed && parsed.name) || sym, yesterdayClose: _q.prevClose };
        _noteMsg = sym + '：盤中分K尚未供,用即時報價合成今日K(自動刷新)';
      }
    } catch {}
  }
  // (2) 連即時報價都無 → 最後退日線
  if (_intradayDef && (!parsed || !parsed.candles.length)) {
    const _draw = await fetchYF(yfsym, { range: '5d', interval: '1d' });
    if (_myLoad !== window.__loadSeq) return;
    const _dp = parseYF(_draw);
    if (_dp && _dp.candles.length) { parsed = _dp; rdef = { range: '5d', interval: '1d' }; _noteMsg = sym + '：暫顯示日線'; }
  }
  if (!parsed || !parsed.candles.length) { setStat('載入失敗'); document.getElementById('chart-loading').textContent='無資料'; return; }
  if (_noteMsg) setStat(_noteMsg);

  // trim for ranges Yahoo doesn't have natively (e.g. 3 weeks = last 15 trading days)
  if (rdef.trim && parsed.candles.length > rdef.trim) {
    parsed.candles = parsed.candles.slice(-rdef.trim);
  }

  // ── Yahoo data freshness fix (v3.6, v3.8.1 修量0) ────────────
  // Yahoo daily K 線陣列偶爾會落後 regularMarketPrice 一天（query1/query2 同步差）。
  // 偵測：rmt 比最後一根 K 線晚 > 20 小時 → 合成一根「今日」K 線。
  // v3.8.1：合成 K 不再用 OHLC=rmp/volume=0（會顯示平盤假 K + 量0），
  //   改用 meta 當日資料：high/low=regularMarketDayHigh/Low、
  //   volume=regularMarketVolume、open=regularMarketOpen(缺則退昨收，
  //   讓 K 棒方向/漲跌% 正確)。另補：最後一根「當日」日 K volume 為
  //   null/0 時用 regularMarketVolume 回填（修前一日量顯示 0 bug）。
  if (parsed.candles.length >= 1 && parsed.meta) {
    const _meta = parsed.meta;
    const _last = parsed.candles[parsed.candles.length - 1];
    const _rmt = _meta.regularMarketTime;
    const _rmp = _meta.regularMarketPrice;
    const _dailyIvl = (rdef.interval === '1d' || rdef.interval === '1wk');
    const _num = v => (v != null && isFinite(v) && v > 0) ? v : null;
    if (_dailyIvl && _rmt && _num(_rmp)
        && _last && _last.time && (_rmt - _last.time) > 20 * 3600) {
      // 昨收 = 前一根日K的收盤(_last.close)。
      // 嚴禁用 meta.chartPreviousClose：那是「請求區間起點」前一日的收盤
      // (6mo 區間 = 半年前的價!)，曾造成合成K 開15.95/收33.43/+109% 假爆量K。
      const _prevC = _num(_last.close);
      let _o = _num(_meta.regularMarketOpen) ?? _prevC ?? _rmp;
      // open 是昨收近似值時可能落在當日高低之外(跳空日) → 夾進 [DayLow, DayHigh]
      const _dh = _num(_meta.regularMarketDayHigh);
      const _dl = _num(_meta.regularMarketDayLow);
      const _h0 = _dh ?? Math.max(_rmp, _o);
      const _l0 = _dl ?? Math.min(_rmp, _o);
      if (_o > _h0) _o = _h0;
      if (_o < _l0) _o = _l0;
      const _h = Math.max(_h0, _rmp);
      const _l = Math.min(_l0, _rmp);
      const _v = (_meta.regularMarketVolume != null && isFinite(_meta.regularMarketVolume) && _meta.regularMarketVolume > 0)
        ? _meta.regularMarketVolume : 0;
      parsed.candles.push({
        time: _rmt, open: _o, high: _h, low: _l, close: _rmp,
        volume: _v, _synthetic: true,
      });
    } else if (rdef.interval === '1d' && _rmt && _last && _last.time
        && Math.abs(_rmt - _last.time) <= 20 * 3600
        && !(_last.volume > 0) && _num(_meta.regularMarketVolume)) {
      // 日線最後一根就是 rmt 當日，但 Yahoo 給的 volume 是 null/0 → 回填
      _last.volume = _meta.regularMarketVolume;
    }
  }

  // ── Intraday yesterdayClose 對齊 ─────────────────────────────
  // intraday (1天 5m) 用倒數第二根 5min K 算 % 是錯的（盤中波動）。
  // 改用 meta.chartPreviousClose 當「真正的昨收」，存到 S.data.yesterdayClose
  // 供 polish_v3.js 的「昨收」線/ci-chg 顏色一起對齊。
  const _isIntraday = (rdef.interval !== '1d' && rdef.interval !== '1wk');
  if (_isIntraday && parsed.meta) {
    const _ycp = parsed.meta.chartPreviousClose ?? parsed.meta.previousClose;
    if (_ycp != null && isFinite(_ycp) && _ycp > 0) {
      parsed.yesterdayClose = _ycp;
    }
  }
  // ── 日線/週線昨收 (v3.9 修「漲幅亂跳」) ──────────────────────
  // 日線 range 的 meta 常缺 previousClose，且若昨日日 K close=null(Yahoo 缺口，
  // 如 00988A 6/15)，parseYF 過濾後 candles[-2] 會變成「更舊一根」(6/12 20.88)，
  // 算出 +8% 假漲幅。改：優先 meta.regularMarketPreviousClose/previousClose，
  // 缺則打 /quote(range=1d 的 previousClose 權威昨收)。存 yesterdayClose 供 ci-chg
  // 與 polish 昨收線一致。
  if (!_isIntraday) {
    let _dp = parsed.meta && (parsed.meta.regularMarketPreviousClose ?? parsed.meta.previousClose);
    if (!(_dp > 0)) {
      try {
        const _q = await fetch(`${SERVER}/quote/${yfsym}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
        if (_q && _q.prevClose > 0) _dp = _q.prevClose;
      } catch {}
      if (_myLoad !== window.__loadSeq) return;   // race guard after await
    }
    if (_dp > 0) parsed.yesterdayClose = _dp;
  }

  // ── intraday 尾盤集合競價量補回 (v3.8) ──────────────────────
  // 台股 13:30 收盤集合競價的量常沒進 Yahoo 5m 最後一根（最後一根 volume=0），
  // 造成「13:25 後沒抓到交易量」。用當日總量 regularMarketVolume 減去其餘各
  // bar 的量，把缺口（含尾盤競價）補回最後一根。
  if (_isIntraday && parsed.meta && parsed.candles.length >= 2) {
    const _rmv = parsed.meta.regularMarketVolume;
    if (_rmv != null && isFinite(_rmv) && _rmv > 0) {
      const _cs = parsed.candles;
      let _sumEx = 0;
      for (let i = 0; i < _cs.length - 1; i++) _sumEx += _cs[i].volume || 0;
      const _rem = _rmv - _sumEx;
      const _lastV = _cs[_cs.length - 1].volume || 0;
      if (_rem > 0 && _rem > _lastV) _cs[_cs.length - 1].volume = _rem;
    }
  }

  S.data = parsed;
  renderChart(parsed.candles);
  document.getElementById('chart-loading').style.display='none';
  document.getElementById('chart-info').style.display='block';

  const last = parsed.candles[parsed.candles.length-1];
  const prev = parsed.candles[parsed.candles.length-2];
  // 昨收統一用 parsed.yesterdayClose(intraday=chartPreviousClose；日線=meta/quote 權威昨收)，
  // 缺才退回前一根 K close。修「日線遇 null 缺口抓到更舊一根→漲幅亂跳」。
  const _prevRef = (parsed.yesterdayClose != null && parsed.yesterdayClose > 0)
    ? parsed.yesterdayClose
    : (prev ? prev.close : null);
  const chgPct = (_prevRef != null && _prevRef > 0)
    ? ((last.close - _prevRef) / _prevRef * 100) : 0;
  document.getElementById('ci-price').textContent = last.close.toFixed(2);
  const ci = document.getElementById('ci-chg');
  ci.textContent = (chgPct>=0?'+':'')+chgPct.toFixed(2)+'%';
  ci.style.color = chgPct>=0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('ci-name').textContent = parsed.name;

  // compute indicators
  S.ind = await runWorker(parsed.candles);
  if (_myLoad !== window.__loadSeq) return;   // 切股 race：指標算完前已切別檔→不覆寫
  renderInd(S.ind, last, mkt);
  if (S.ind) updateEtfFlowInd();
  try { renderRpanel(); } catch (e) { console.error('[v1] renderRpanel threw:', e); }
  try { window.dispatchEvent(new CustomEvent('symLoaded', {detail:{sym: S.sym, mkt: S.mkt}})); } catch(e){}

  // update wl chip price
  updateWlPrice(sym, last.close, chgPct);
  setStat('OK · '+sym);
}

// ── CHART ────────────────────────────────────────────────────────
function renderChart(candles) {
  const wrap = document.getElementById('chart-wrap');
  if (S.chart) { S.chart.remove(); S.chart=null; }

  // intraday (1d range, 5m interval) → show HH:mm; daily/weekly → date only
  const isIntraday = S.range === '1d';

  // ── 時區平移：使用者本地時區 (v3.6) ──────────────────────────
  // lightweight-charts 預設用 UTC 顯示。台北使用者看 13:30 收盤的台股會
  // 顯示 05:30，看美股 09:30 開盤會顯示成 09:30 ET。改用本地 TZ offset
  // 平移後，所有市場的時間軸都對應到「使用者本地時鐘」：
  //   TW 股 in Taipei: 09:00–13:30
  //   US 股 in Taipei: 21:30–04:00 隔天
  // Crosshair 讀回時必須用 getUTC*（時間已被預先平移過）
  const userTzOffset = -new Date().getTimezoneOffset() * 60;
  S.tzOffset = userTzOffset;
  const tz = (t) => (t == null ? t : t + userTzOffset);

  const chart = LightweightCharts.createChart(wrap, {
    width: wrap.clientWidth, height: wrap.clientHeight,
    layout:{background:{color:'#060A12'},textColor:'#5A6A82'},
    grid:{vertLines:{color:'#0F1A2B'},horzLines:{color:'#0F1A2B'}},
    crosshair:{
      // Magnet 磁吸模式:水平線吸附到最近 K 棒的數值(像 Yahoo 貼著線走,不隨滑鼠 Y 每像素跳動)
      mode:LightweightCharts.CrosshairMode.Magnet,
      // Yahoo 風格:金色虛線 + 軸上時間/價格標籤泡泡
      vertLine:{color:'rgba(245,197,24,.55)',width:1,style:2,labelVisible:true,labelBackgroundColor:'#B8860B'},
      horzLine:{color:'rgba(245,197,24,.55)',width:1,style:2,labelVisible:true,labelBackgroundColor:'#B8860B'},
    },
    rightPriceScale:{borderColor:'#1A2740',
      // 盤中(1天)加大上下留白 → 把當日小波動壓平(flatten),不再撐滿全高顯得震盪劇烈
      scaleMargins: isIntraday ? {top:0.30,bottom:0.30} : {top:0.05,bottom:0.18}},
    timeScale:{
      borderColor:'#1A2740',
      timeVisible: isIntraday,
      secondsVisible: false,
      rightOffset: 2,         // tiny right padding so latest candle isn't glued to axis
      barSpacing: 6,          // baseline spacing, fitContent will scale it
      minBarSpacing: 0.5,     // allow squish for 'max' range with many bars
      fixLeftEdge: true,
      fixRightEdge: true,
      lockVisibleTimeRangeOnResize: true,
    },
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true},
  });
  S.chart = chart;

  const cs = chart.addCandlestickSeries({
    upColor:'#4ADE80',downColor:'#F87171',
    borderUpColor:'#4ADE80',borderDownColor:'#F87171',
    wickUpColor:'#4ADE80',wickDownColor:'#F87171',
    lastValueVisible:false, priceLineVisible:false,   // 原生現價框關掉，改用 polish_v3 的「今/昨」小標籤
  });
  const lcd = candles.map(c=>({time:tz(c.time),open:c.open,high:c.high,low:c.low,close:c.close}));
  cs.setData(lcd);
  // 每根 K 對應「前一根收盤(昨收)」→ 供十字游標 ci-ohlc 算漲跌(台股以昨收為基準,非開盤)
  const _prevCloseByTime = new Map();
  for (let _i = 0; _i < lcd.length; _i++) _prevCloseByTime.set(lcd[_i].time, _i > 0 ? lcd[_i - 1].close : null);
  // 十字圓點:透明收盤線 + crosshairMarker → 游標貼著收盤走時顯示金色圓點(像 Yahoo)
  const _dotSeries = chart.addLineSeries({
    color:'rgba(0,0,0,0)', lineWidth:1, priceLineVisible:false, lastValueVisible:false,
    crosshairMarkerVisible:true, crosshairMarkerRadius:4,
    crosshairMarkerBorderColor:'#F5C518', crosshairMarkerBackgroundColor:'rgba(245,197,24,.9)', crosshairMarkerBorderWidth:1,
  });
  _dotSeries.setData(lcd.map(c=>({time:c.time, value:c.close})));
  S.dotSeries = _dotSeries;
  // 盤中(1天)固定 X 軸到整個交易時段(台股9:00–13:30/美股9:30–16:00):用「獨立透明 whitespace 系列」延伸時間軸。
  // ⚠不可把 whitespace 放在 K 棒系列 — 否則「最後一根」變成收盤時間,realtime 的 series.update(只能改最後一根或往後append)會失效。
  if (isIntraday && lcd.length) {
    const _lastTz = lcd[lcd.length - 1].time;
    const _midnight = _lastTz - (_lastTz % 86400);
    const _closeTz = _midnight + ((S.mkt === 'TW') ? 13.5 * 3600 : 16 * 3600);
    const _wsSeries = chart.addLineSeries({ color: 'rgba(0,0,0,0)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    const _ws = [];
    for (let t = lcd[0].time; t <= _closeTz; t += 60) _ws.push({ time: t });   // 透明留白點撐開時間軸到收盤
    _wsSeries.setData(_ws);
    S.wsSeries = _wsSeries;
  }
  // 非盤中:把 X 軸補到「所選範圍」起點,符合時間軸概念(選10年就畫10年寬,新股資料短就擠右側一小條)。
  // 老股資料已涵蓋整個範圍 → lcd[0] 早於起點 → 不補;新股資料短 → 左側透明 whitespace 撐出完整範圍。
  if (!isIntraday && lcd.length && S.range !== 'max') {
    const _DAYS = { '3w':21, '1mo':31, '3mo':93, '6mo':186, '1y':366, '2y':731, '5y':1827, '10y':3653 };
    let _startTz = null;
    if (S.range === 'ytd') {
      const _d = new Date();
      _startTz = Math.floor(Date.UTC(_d.getFullYear(), 0, 1) / 1000) + userTzOffset;
    } else if (_DAYS[S.range]) {
      _startTz = lcd[lcd.length - 1].time - _DAYS[S.range] * 86400;
    }
    if (_startTz != null && lcd[0].time > _startTz) {
      const _wsL = chart.addLineSeries({ color:'rgba(0,0,0,0)', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
      const _arr = [];
      for (let t = _startTz; t < lcd[0].time; t += 86400) _arr.push({ time: t });
      if (_arr.length) { _wsL.setData(_arr); S.wsLeftSeries = _wsL; }
    }
  }
  S.chartSeries = cs;

  // v3.9：指數(如 ^SOX/美股指數)Yahoo 無成交量 → 隱藏量柱區，價格用滿高度
  const _hasVol = candles.some(c => c.volume > 0);
  let vs = null;   // ← 須在函式層宣告:十字游標處理器(param.seriesData.get(vs))會引用,
                   //    否則無量股(隱藏量柱)時 vs 未定義→游標移動拋錯→ci-ohlc 面板填不上而消失
  if (_hasVol) {
    vs = chart.addHistogramSeries({
      color:'rgba(96,165,250,0.3)',priceFormat:{type:'volume'},
      priceScaleId:'vol',
    });
    chart.priceScale('vol').applyOptions({scaleMargins:{top:0.8,bottom:0}});
    vs.setData(candles.map(c=>({time:tz(c.time),value:c.volume,color:c.close>=c.open?'rgba(74,222,128,0.25)':'rgba(248,113,113,0.25)'})));
    S.volSeries = vs;
  } else {
    S.volSeries = null;
    chart.priceScale('right').applyOptions({scaleMargins:{top:0.06,bottom:0.04}});  // 無量→價格滿版
  }

  // ── SMA + Bollinger Bands overlay (skip on intraday) ──
  S.overlaySeries = {};
  if (!isIntraday && candles.length >= 20) {
    const closes = candles.map(c => c.close);
    const sma = (n, i) => {
      if (i + 1 < n) return null;
      let s = 0;
      for (let k = i - n + 1; k <= i; k++) s += closes[k];
      return s / n;
    };
    const std = (n, i, mean) => {
      if (i + 1 < n) return null;
      let v = 0;
      for (let k = i - n + 1; k <= i; k++) v += Math.pow(closes[k] - mean, 2);
      return Math.sqrt(v / n);
    };

    const sma20Data = candles.map((c, i) => { const v = sma(20, i); return v == null ? null : {time: tz(c.time), value: v}; }).filter(Boolean);
    const sma60Data = candles.map((c, i) => { const v = sma(60, i); return v == null ? null : {time: tz(c.time), value: v}; }).filter(Boolean);
    const bbU = candles.map((c, i) => { const m = sma(20, i); if (m == null) return null; const s = std(20, i, m); return {time: tz(c.time), value: m + 2 * s}; }).filter(Boolean);
    const bbL = candles.map((c, i) => { const m = sma(20, i); if (m == null) return null; const s = std(20, i, m); return {time: tz(c.time), value: m - 2 * s}; }).filter(Boolean);

    const mkLine = (color, width, dashed) => chart.addLineSeries({
      color, lineWidth: width, lastValueVisible: false, priceLineVisible: false,
      lineStyle: dashed ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
      crosshairMarkerVisible: false,
    });
    const sma20S = mkLine('#FBBF24', 1, false);   sma20S.setData(sma20Data);
    const sma60S = mkLine('#67E8F9', 1, false);   sma60S.setData(sma60Data);
    const bbUS   = mkLine('rgba(96,165,250,.6)', 1, true); bbUS.setData(bbU);
    const bbLS   = mkLine('rgba(96,165,250,.6)', 1, true); bbLS.setData(bbL);
    S.overlaySeries = { sma20: sma20S, sma60: sma60S, bbU: bbUS, bbL: bbLS };
  }

  // ── Crosshair: dynamic OHLCV display following cursor ──
  chart.subscribeCrosshairMove(param => {
    const ohlcEl = document.getElementById('ci-ohlc');
    if (!ohlcEl) return;
    if (!param || !param.point || !param.time || !param.seriesData) {
      ohlcEl.style.display = 'none';
      return;
    }
    const k = param.seriesData.get(cs);
    const v = param.seriesData.get(vs);
    if (!k) { ohlcEl.style.display = 'none'; return; }

    // Date string (intraday → date+time, daily → date only)
    // 時間已被預先平移到使用者本地時區 → 用 getUTC* 讀取才能取得當地的時/分/日
    const d = new Date(typeof param.time === 'number' ? param.time * 1000 : Date.parse(param.time));
    const ds = isIntraday
      ? `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`
      : `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`;

    // 台股紅漲綠跌；美股綠漲紅跌
    const twC = (S.mkt === 'TW');
    const upCol = twC ? 'var(--red)' : 'var(--green)';
    const dnCol = twC ? 'var(--green)' : 'var(--red)';
    // 漲跌基準 = 昨收(前一根收盤)，非開盤；首根無昨收則退回開盤
    const _pc = _prevCloseByTime.get(param.time);
    const _base = (_pc != null && _pc > 0) ? _pc : k.open;
    // 高於昨收=漲(紅)、低於昨收=跌(綠)、等於昨收=平盤(無色)
    const col = (k.close > _base) ? upCol : (k.close < _base ? dnCol : 'var(--tlo)');
    const chgPct = ((k.close - _base) / _base * 100);

    // MA values at this time
    let maRow = '';
    if (S.overlaySeries) {
      const m20 = param.seriesData.get(S.overlaySeries.sma20);
      const m60 = param.seriesData.get(S.overlaySeries.sma60);
      const u   = param.seriesData.get(S.overlaySeries.bbU);
      const l   = param.seriesData.get(S.overlaySeries.bbL);
      const parts = [];
      if (m20) parts.push(`<span style="color:#FBBF24">SMA20 ${m20.value.toFixed(2)}</span>`);
      if (m60) parts.push(`<span style="color:#67E8F9">SMA60 ${m60.value.toFixed(2)}</span>`);
      if (u && l) parts.push(`<span style="color:rgba(96,165,250,.85)">BB ${l.value.toFixed(2)} ~ ${u.value.toFixed(2)}</span>`);
      if (parts.length) maRow = ` <span class="ohlc-k">·</span> ${parts.join(' ')}`;   // 壓成同一行(去掉換行 .ma-row)
    }

    ohlcEl.style.display = 'block';
    ohlcEl.innerHTML =
      `<span class="ohlc-d">${ds}</span>` +
      `<span class="ohlc-k">開</span><span class="ohlc-v" style="color:var(--thi)">${k.open.toFixed(2)}</span>` +
      `<span class="ohlc-k">高</span><span class="ohlc-v" style="color:${upCol}">${k.high.toFixed(2)}</span>` +
      `<span class="ohlc-k">低</span><span class="ohlc-v" style="color:${dnCol}">${k.low.toFixed(2)}</span>` +
      `<span class="ohlc-k">收</span><span class="ohlc-v" style="color:${col}">${k.close.toFixed(2)}</span>` +
      `<span style="color:${col};margin-right:8px">(${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%)</span>` +
      (v ? `<span class="ohlc-k">量</span><span class="ohlc-v" style="color:var(--blue)">${formatVol(v.value)}</span>` : '') +
      maRow;
  });

  // 🔑 Fit all candles to one page width
  requestAnimationFrame(()=>chart.timeScale().fitContent());

  const ro = new ResizeObserver(()=>{
    chart.applyOptions({width:wrap.clientWidth,height:wrap.clientHeight});
    chart.timeScale().fitContent();
  });
  ro.observe(wrap);
}

function formatVol(v) {
  if (v == null || isNaN(v)) return '--';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '億';
  if (v >= 1e4) return (v / 1e4).toFixed(0) + '萬';
  return Math.round(v).toLocaleString();
}

// Drag-and-drop reordering for watchlist chips
let _dragSrcChip = null;
function attachDragWl() {
  const ct = document.getElementById('wlchips');
  if (!ct) return;
  ct.querySelectorAll('.wlchip').forEach(chip => {
    chip.addEventListener('dragstart', e => {
      _dragSrcChip = chip;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', chip.dataset.sym || ''); } catch {}
    });
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging');
      _dragSrcChip = null;
      ct.querySelectorAll('.wlchip').forEach(c => c.classList.remove('drop-before','drop-after'));
    });
    chip.addEventListener('dragover', e => {
      if (!_dragSrcChip || _dragSrcChip === chip) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = chip.getBoundingClientRect();
      const isAfter = (e.clientX - r.left) > r.width / 2;
      chip.classList.toggle('drop-after', isAfter);
      chip.classList.toggle('drop-before', !isAfter);
    });
    chip.addEventListener('dragleave', () => {
      chip.classList.remove('drop-before','drop-after');
    });
    chip.addEventListener('drop', e => {
      e.preventDefault();
      if (!_dragSrcChip || _dragSrcChip === chip) return;
      const srcSym = _dragSrcChip.dataset.sym, srcMkt = _dragSrcChip.dataset.mkt;
      const tgtSym = chip.dataset.sym, tgtMkt = chip.dataset.mkt;
      const r = chip.getBoundingClientRect();
      const insertAfter = (e.clientX - r.left) > r.width / 2;
      reorderWl(srcSym, srcMkt, tgtSym, tgtMkt, insertAfter);
    });
  });
}
function reorderWl(srcSym, srcMkt, tgtSym, tgtMkt, insertAfter) {
  const srcIdx = S.wl.findIndex(w => w.t === srcSym && w.m === srcMkt);
  if (srcIdx === -1) return;
  const [item] = S.wl.splice(srcIdx, 1);
  let tgtIdx = S.wl.findIndex(w => w.t === tgtSym && w.m === tgtMkt);
  if (tgtIdx === -1) { S.wl.push(item); }
  else {
    if (insertAfter) tgtIdx++;
    S.wl.splice(tgtIdx, 0, item);
  }
  saveWl();
  renderWl();
}
function getPcls(c) { if(c==null)return'flat'; return c>0?'pos':c<0?'neg':'flat'; }

function updateWlPrice(sym, price, chgPct) {

let _aiModel = 'claude-sonnet-4-6';     // fallback(現行有效)
let _aiModelResolved = false;
async function refreshAIModel() {
  // 改由 server 解析(server 端持有金鑰查 /v1/models)→ 金鑰不進瀏覽器。
  try {
    const r = await fetch(`${SERVER}/ai-model`, { cache: 'no-store' });

    const j = await r.json();
    if (j && j.model) { _aiModel = j.model; console.log('[ai] 自適應模型 →', j.model); }
  } catch (e) { /* 保留 fallback */ }
}
async function ensureAIModel() {
  if (!_aiModelResolved) { await refreshAIModel(); _aiModelResolved = true; }

}

async function startAnalysis(mode) {
  mode = mode || 'stock';
  if (!S.aiKeySet) { showKeyModal(); return; }
  if (S.analyzing) return;
  if (mode === 'stock' && !S.sym) return;
  S.anaMode = mode;
  S.secDefs = (mode === 'market') ? MARKET_SECTION_DEFS : SECTION_DEFS;
  S.analyzing=true; S.streamText=''; S.sources=[]; S.phase=mode==='market'?'分析大盤中...':'分析中...'; S.sections=[];
  renderRpanel();

  let userMsg, systemPrompt;
  if (mode === 'market') {
    systemPrompt = MARKET_SYS_PROMPT;
    const snap = gatherMarketSnapshot();
    userMsg = `請撰寫台股大盤分析與隔日策略報告。\n\n# 目前即時數據（大盤列）\n${snap}\n\n` +
      `請結合上述數據，並用 web_search 補最新（加權指數量能、三大法人買賣超、外資期貨、台指期夜盤、美股與費半、重大事件）。\n` +
      `嚴格按章節標記輸出，從 [[[SECTION:大盤總覽]]] 開始，共六章節，不要寫標題行。`;
  } else {
    systemPrompt = SYS_PROMPT;
    const mktLabel = S.mkt==='TW'
      ? `台股（代號：${S.sym}，幣別：TWD 新台幣）`
      : `美股（Nasdaq/NYSE 代號：${S.sym}，幣別：USD 美元）`;
    userMsg = `請對以下個股撰寫完整八章節研究報告：\n市場：${mktLabel}\n股票代號：${S.sym}\n\n請嚴格按章節標記輸出，每章節以 [[[SECTION:章節名]]] 開頭，直接從 [[[SECTION:公司簡介]]] 開始，不要寫任何標題行。`;
  }

  try {
    const res = await fetch(`${SERVER}/ai-proxy`, {   // 經本機 server 代理(金鑰在 server,不進瀏覽器)
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({
        model:(await ensureAIModel()),
        max_tokens:6000, stream:true,
        system:systemPrompt,
        messages:[{role:'user',content:userMsg}],
        tools:[{type:'web_search_20250305',name:'web_search'}]
      })
    });
    if (!res.ok) { const e=await res.json().catch(()=>{}); throw new Error(e?.error?.message||'API '+res.status); }

    const reader=res.body.getReader(), dec=new TextDecoder();
    let buf='', fullText='';
    const seenUrls=new Set();
    let toolPhase=false;

    while(true) {
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines) {
        if(!line.startsWith('data: ')) continue;
        try {
          const ev=JSON.parse(line.slice(6));
          if(ev.type==='content_block_start') {
            const cb=ev.content_block;
            if(cb?.type==='server_tool_use'&&cb.name==='web_search') { toolPhase=true; S.phase='搜尋公開市場資訊'; }
            if(cb?.type==='web_search_tool_result'&&Array.isArray(cb.content)) {
              for(const item of cb.content) {
                if(item.url&&!seenUrls.has(item.url)) { seenUrls.add(item.url); S.sources.push({url:item.url,title:item.title||item.url}); }
              }
            }
            if(cb?.type==='text'&&toolPhase) { toolPhase=false; S.phase='撰寫研究報告'; }
          }
          if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta') {
            fullText+=ev.delta.text; S.streamText=fullText;
          }
          if(ev.type==='message_stop') {
            S.sections=parseSections(fullText);
            S.analyzing=false; S.phase='';
            const _tk = S.anaMode==='market' ? '大盤' : S.sym;
            const report={ticker:_tk,market:S.mkt,text:fullText,sources:S.sources,sections:S.sections,timestamp:Date.now()};
            addHist(report);
            renderRpanel();
            return;
          }
        } catch {}
      }
      // live update every chunk
      renderRpanel();
      await new Promise(r=>setTimeout(r,0));
    }
  } catch(e) {
    S.analyzing=false; S.phase='';
    const el=document.getElementById('rpanel');
    if(el) el.innerHTML+=`<div style="padding:10px 12px;color:var(--red);font-family:JetBrains Mono,monospace;font-size:10px">⚠ ${escHtml(e.message)}</div>`;
  }
}

async function runBatch() {
  if (!S.apiKey||S.batchRunning||!S.batch.length) return;

      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:(await ensureAIModel()),max_tokens:6000,stream:true,system:SYS_PROMPT,messages:[{role:'user',content:userMsg}],tools:[{type:'web_search_20250305',name:'web_search'}]})
    });
    if(!res.ok) throw new Error('API '+res.status);
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',fullText='';
    const sources=[],seenUrls=new Set();
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        try{
          const ev=JSON.parse(line.slice(6));
          if(ev.type==='content_block_start'&&ev.content_block?.type==='web_search_tool_result'&&Array.isArray(ev.content_block.content)){
            for(const item of ev.content_block.content) if(item.url&&!seenUrls.has(item.url)){seenUrls.add(item.url);sources.push({url:item.url,title:item.title||item.url});}
          }
          if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta') fullText+=ev.delta.text;
          if(ev.type==='message_stop'){
            b.status='done'; b.statusTxt='完成';
            addHist({ticker:b.sym,market:b.mkt,text:fullText,sources,sections:parseSections(fullText),timestamp:Date.now()});
            renderRpanel(); return;
          }
        }catch{}
      }

// ── AI 報告匯出 PDF / Email (v3.9) ──────────────────────────────
function reportDocHTML() {
  const _defs = S.secDefs || SECTION_DEFS;
  const title = (S.anaMode === 'market') ? '台股大盤分析與隔日策略' : `${S.sym} 個股研究報告`;
  const date = new Date().toLocaleString('zh-TW', { hour12: false });
  let secs = '';
  for (const sec of (S.sections || [])) {
    const def = _defs.find(d => d.key === sec.key) || { zh: sec.key };
    secs += `<h2>${def.zh}</h2>${mdToHtml(sec.content)}`;
  }
  let src = '';
  if (S.sources && S.sources.length) {
    src = '<h2>資料來源</h2><ol>' + S.sources.map(s => `<li><a href="${s.url}">${(s.title || s.url)}</a></li>`).join('') + '</ol>';
  }
  return `<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><title>${title}</title>
    <style>body{font-family:'Microsoft JhengHei','PingFang TC',Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 20px;color:#1a1a1a;line-height:1.7}
    h1{font-size:20px;border-bottom:2px solid #333;padding-bottom:8px}
    h2{font-size:15px;color:#1f4e79;margin-top:22px;border-left:4px solid #1f4e79;padding-left:8px}
    table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}th,td{border:1px solid #ccc;padding:5px 8px;text-align:left}th{background:#f0f4f8}
    a{color:#1f4e79;word-break:break-all}.meta{color:#666;font-size:12px;margin-bottom:16px}
    .foot{margin-top:24px;color:#999;font-size:11px;border-top:1px solid #ddd;padding-top:8px}
    @media print{a{color:#1f4e79}}</style></head>
    <body><h1>${title}</h1>
    <div class="meta">產生時間:${date} · Stock Terminal AI 分析</div>
    ${secs}${src}
    <div class="foot">本報告由 Stock Terminal AI 生成,資料來源見上。投資有風險,僅供參考、非投資建議。</div>` + '</' + 'body></' + 'html>';
    // ↑ 結尾標籤用字串串接,避免原始碼出現字面 </body>(build_v2 以 </body> 為 script 注入點,會誤注入進此字串)
}
function exportReportPDF() {

    });

    else { setStat('寄送失敗'); alert('寄送失敗:' + (j.error || r.status) + '\n\n需先在 🔔 通知 設定 Email SMTP(寄件帳號/應用程式密碼)。'); }
  } catch (e) { setStat('寄送失敗'); alert('寄送失敗:' + e.message); }
}

function mdToHtml(raw) {
  if(!raw) return '';
  let t=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/(\|.+\|\r?\n\|[-|: ]+\|\r?\n)((?:\|.+\|\r?\n?)+)/g,(_,head,body)=>{
    const hCells=head.split('\n')[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const rows=body.trim().split('\n').map(r=>{
      const cells=r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<div style="overflow-x:auto;margin:6px 0;border:1px solid var(--border);border-radius:4px"><table><thead><tr>${hCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  t=t
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\n{2,}/g,'|||').replace(/\n/g,'<br>').replace(/\|\|\|/g,'</p><p>');
  t=t.replace(/(<li[^>]*>.*?<\/li>)+/gs,m=>`<ul>${m}</ul>`);
  return `<p>${t}</p>`;
}
function parseSections(text) {
  if(!text) return [];
  const regex=/\[\[\[SECTION:(.+?)\]\]\]/g;
  const parts=text.split(/\[\[\[SECTION:.+?\]\]\]/);
  const matches=[...text.matchAll(regex)];
  return matches.map((m,i)=>({key:m[1].trim(),content:(parts[i+1]||'').trim()}));
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const ETF_MAP_NAMES = {
  '00992A':'群益科技創新','00981A':'統一台股增長',
  '00987A':'台新優勢成長','00994A':'第一金台股優',
  '00982A':'群益台灣強棒','00995A':'中信台灣卓越',
  '00980A':'野村臺灣優選','00991A':'復華未來50',
  '00996A':'兆豐台灣豐收','00984A':'安聯台灣高息',
};

async function fetchEtfDelta(date) {
  S.etfLoading = true;
  S.etfErr = null;
  try {
    const url = date ? `${SERVER}/etf-delta?date=${date}` : `${SERVER}/etf-delta`;
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
      S.etfDelta = null; S.etfErr = msg; S.etfLoading = false;
      if (S.tab === 'etf') renderRpanel();
      return;
    }
    S.etfDelta = await r.json();
    renderWl();
    updateEtfFlowInd();
    if (S.tab === 'etf')   renderRpanel();
    if (S.tab === 'stats') renderRpanel();
  } catch (e) { S.etfDelta = null; S.etfErr = e.message || 'fetch failed'; }
  S.etfLoading = false;
}

function getEtfFlowForStock(code) {
  if (!S.etfDelta) return null;
  let addCount=0, rmCount=0, chgSum=0;
  for (const etf of (S.etfDelta.etfs||[])) {
    if ((etf.new||[]).find(s=>s.code===code))     addCount++;
    if ((etf.removed||[]).find(s=>s.code===code)) rmCount++;
    const chg = (etf.changed||[]).find(s=>s.code===code);
    if (chg) chgSum += chg.delta;
  }
  return {addCount, rmCount, chgSum};
}

function updateEtfFlowInd() {
  const el = document.getElementById('ig-etfFlow');
  if (!el || !S.sym) return;
  if (!S.etfDelta) { el.textContent='--'; return; }
  const flow = getEtfFlowForStock(S.sym);
  if (!flow) { el.textContent='--'; return; }
  if (flow.addCount > 0)      { el.textContent=`+${flow.addCount} ETF`; el.style.color='var(--green)'; }
  else if (flow.rmCount > 0)  { el.textContent=`-${flow.rmCount} ETF`; el.style.color='var(--red)'; }
  else if (Math.abs(flow.chgSum) >= 0.5) {
    el.textContent=(flow.chgSum>0?'+':'')+flow.chgSum.toFixed(2)+'%';
    el.style.color=flow.chgSum>0?'var(--green)':'var(--red)';
  } else { el.textContent='無訊號'; el.style.color='var(--tf)'; }
}

function renderEtfHoldingsForStock(sym) { return ""; }

</script>
