name: 明確授權的完整驗證
on:
  workflow_dispatch:
    inputs:
      user_quote:
        description: Sam 明確同意此次完整驗證的原文
        required: true
        type: string
      source:
        description: 授權來源
        required: true
        type: string
      necessity:
        description: 為何局部驗證不足
        required: true
        type: string
permissions:
  contents: read
jobs:
  authorization:
    name: 核對完整驗證授權
    runs-on: ubuntu-latest
    steps:
      - name: 核對完整驗證的必要性與授權
        env:
          CONSENT: ${{ inputs.user_quote }}
          SOURCE: ${{ inputs.source }}
          NECESSITY: ${{ inputs.necessity }}
        run: python -c "import os; assert all(os.environ[k].strip() for k in ('CONSENT','SOURCE','NECESSITY')), '缺少明確授權或必要性'"

  test:
    needs: authorization
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}-playwright-browsers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Python syntax
        run: python -m compileall -q server scripts tests wavedeck
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: WaveDeck 隔離測試
        run: python -W error::ResourceWarning -m unittest discover -s wavedeck/tests -p "test_*.py" -v
      - name: build_order self-test
        run: python build_order.py
      - name: JavaScript contract self-tests
        shell: bash
        run: |
          for test in tests/*selftest.js; do node "$test"; done
      - name: Build v2 HTML
        run: python build_v2.py --out stock_terminal_v2.ci.html
      - name: 安裝固定版本瀏覽器驗收工具
        run: npm ci --ignore-scripts
      - name: 還原 Chromium 快取
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: 準備 Chromium
        # 命中快取仍檢查瀏覽器及安裝 Linux 系統依賴，不跳過任何驗收。
        run: npx playwright install --with-deps chromium
      - name: 瀏覽器行為與 UI 對照工具驗收
        shell: bash
        # Collect executable test entries only; helper/fixture .cjs files are excluded.
        # Existing and new *_browser.cjs / *selftest.cjs cases share this full gate.
        run: |
          shopt -s nullglob
          browser_tests=(tests/*_browser.cjs tests/*瀏覽器.cjs tests/*selftest.cjs)
          if ((${#browser_tests[@]} == 0)); then
            echo 'No browser test entries found.' >&2
            exit 1
          fi
          for test in "${browser_tests[@]}"; do node "$test"; done
      - name: Windows PowerShell 5.1 使用者入口語法
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/check_powershell_entrypoints.ps1
      - name: PowerShell 7 使用者入口語法
        shell: pwsh
        run: ./tests/check_powershell_entrypoints.ps1
      # tests/test_dist_scrub.py 已由上方 Unit tests 的 discovery 執行。

  research:
    needs: authorization
    name: 離線研究 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      ST_RESEARCH_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安裝選用研究依賴
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt -r requirements-research.txt
      - name: 離線數值與跨核心驗證
        run: python -m unittest tests.test_離線策略驗證 -v
