name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}-playwright-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 先核對變更與案例，未知範圍直接拒絕
        id: plan
        run: python -B scripts/變更驗證.py --check --evidence-dir "${{ runner.temp }}/驗證證據"
      - name: 安裝此次 Python 案例所需依賴
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/setup-node@v7
        if: steps.plan.outputs.node == 'true'
        with:
          node-version: '22'
      - name: 安裝研究依賴
        if: steps.plan.outputs.research == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt
      - name: 安裝瀏覽器案例依賴
        if: steps.plan.outputs.browser == 'true'
        run: npm ci --ignore-scripts
      - name: 還原 Chromium 快取
        if: steps.plan.outputs.browser == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: 準備本次需要的 Chromium
        if: steps.plan.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: 沿用有效證據並只執行明列案例
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/變更驗證.py --evidence-dir "${{ runner.temp }}/驗證證據" --restore-ci "驗證證據-${{ runner.os }}"
      - name: 保存案例結果供相同內容沿用
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 驗證證據-${{ runner.os }}
          path: ${{ runner.temp }}/驗證證據
          if-no-files-found: ignore
