name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: build_order self-test
        run: python build_order.py
      - name: Build v2 HTML
        run: python build_v2.py
      - name: Dist scrub (via unittest)
        run: python -m unittest tests.test_dist_scrub -v
