name: ci
on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Python syntax
        run: python -m compileall -q server scripts tests wavedeck
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: WaveDeck 測試
        run: python -W error::ResourceWarning -m unittest wavedeck.tests.test_smoke -v
      - name: build_order self-test
        run: python build_order.py
      - name: JavaScript contract self-tests
        shell: bash
        run: |
          for test in tests/*selftest.js; do node "$test"; done
      - name: Build v2 HTML
        run: python build_v2.py --out stock_terminal_v2.ci.html
      - name: PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\scripts\go.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          $stopOutput = @(& cmd /d /c .\STOP_PRIVATE_WEB.cmd 2>&1)
          if ($LASTEXITCODE -ne 0) { $stopOutput; exit $LASTEXITCODE }
          $expected = '^(正在停止 Private Web ST|Private Web ST 已停止)'
          $unexpected = @($stopOutput | Where-Object { $_ -and $_ -notmatch $expected })
          if ($unexpected.Count) { $unexpected; exit 1 }
      - name: Dist scrub (via unittest)
        run: python -m unittest tests.test_dist_scrub -v
