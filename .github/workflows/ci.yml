name: ci
on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Python syntax
        run: python -m compileall -q server scripts tests wavedeck
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: WaveDeck 隔離測試
        run: python -W error::ResourceWarning -m unittest wavedeck.tests.test_smoke -v
      - name: build_order self-test
        run: python build_order.py
      - name: JavaScript contract self-tests
        shell: bash
        run: |
          for test in tests/*selftest.js; do node "$test"; done
      - name: Build v2 HTML
        run: python build_v2.py --out stock_terminal_v2.ci.html
      - name: 安裝固定版本瀏覽器驗收工具
        run: npm ci --ignore-scripts
      - name: 準備 Chromium
        run: npx playwright install --with-deps chromium
      - name: 觸控與前瞻等待狀態驗收
        run: npm run test:browser
      - name: 研究工作台多尺寸與操作驗收
        run: npm run test:research-browser
      - name: 資料核對結果與執行版本驗收
        run: npm run test:data-browser
      - name: 型態視窗回覆歸屬與證據用語驗收
        run: npm run test:pattern-browser
      - name: PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('.\scripts\go.ps1', '.\scripts\start_local.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
      - name: Dist scrub (via unittest)
        run: python -m unittest tests.test_dist_scrub -v

  research:
    name: 離線研究 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      ST_RESEARCH_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安裝選用研究依賴
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt -r requirements-research.txt
      - name: 離線數值與跨核心驗證
        run: python -m unittest tests.test_離線策略驗證 -v
