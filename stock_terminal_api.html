<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060A12;--bg2:#0B1220;--bg3:#111B2E;--bg4:#162240;--border:#1A2740;

  --red:#F87171;--rnb:rgba(248,113,113,.08);--rbd:rgba(248,113,113,.3);
  --blue:#60A5FA;--bnb:rgba(96,165,250,.08);--bbd:rgba(96,165,250,.3);
  --cyan:#67E8F9;--orange:#FB923C;}
html,body{background:var(--bg);height:100%;font-family:monospace;color:var(--text)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A3D5C;border-radius:2px}
.app{display:flex;flex-direction:column;height:100vh}
/* top bar */
.top{flex-shrink:0;background:rgba(6,10,18,.97);border-bottom:1px solid var(--border);padding:0 12px;height:48px;display:flex;align-items:center;gap:8px}
.logo{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:700}
.bd{display:flex;align-items:center;gap:5px;padding:0 8px;border-left:1px solid var(--border);font-size:10px}
.bup{color:var(--green);font-weight:700}.bdn{color:var(--red);font-weight:700}.bsep{color:var(--tf)}
.sp{flex:1}
.pl{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:pulse 2.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--tlo);font-family:monospace;font-size:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gm);color:var(--gold);background:var(--gs)}
.btn.gold{background:var(--gold);color:#060A12;border-color:var(--gold)}

.api-bar{flex-shrink:0;background:#0a0f1a;border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:9px}

.api-input:focus{border-color:var(--gold)}

.api-status.ok{background:var(--gnb);color:var(--green);border:1px solid var(--gbd)}

.api-status.none{color:var(--tlo)}
/* add bar */

.sym-input:focus{border-color:var(--gold)}
.mkt-sel{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 6px;color:var(--text);font-family:monospace;font-size:9px;outline:none;cursor:pointer}
.add-btn{padding:5px 14px;background:var(--gold);color:#060A12;border:none;border-radius:5px;font-family:monospace;font-size:11px;font-weight:700;cursor:pointer}
/* watchlist */
.wl{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;gap:2px;padding:4px 8px}
.wi{padding:5px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--bg2)}

.wm{font-size:7px;padding:1px 3px;border-radius:2px}

.wpx{font-size:10px;color:var(--thi)}

.wch.up{color:var(--green)}.wch.dn{color:var(--red)}.wch.flat{color:var(--tlo)}

/* body */
.body{flex:1;display:flex;overflow:hidden}
.ct{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ca{flex:1;position:relative;background:var(--bg);min-height:0;overflow:hidden}

.rt{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.rtb{flex:1;padding:7px 0;text-align:center;font-size:9px;color:var(--tlo);letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent}
.rtb.act{color:var(--gold);border-bottom-color:var(--gold)}
.rb{flex:1;overflow-y:auto;padding:12px}
.re{text-align:center;padding:30px 0;font-size:9px;color:var(--tf);line-height:1.8}
/* stats */
.st{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:2px}
.sn{font-size:11px;color:var(--tlo);margin-top:2px;margin-bottom:9px}
.spr{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.sp2{font-size:19px;font-weight:700;color:var(--thi)}
.scr{font-size:10px;color:var(--tlo)}
.sbg{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700}
.sbg.tw{background:var(--gnb);color:var(--green);border:1px solid var(--gbd)}
.sbg.us{background:var(--bnb);color:var(--blue);border:1px solid var(--bbd)}
.sch{font-size:14px;font-weight:700;margin-bottom:11px}
.sch.up{color:var(--green)}.sch.dn{color:var(--red)}.sch.flat{color:var(--tlo)}
.sr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.sr:last-of-type{border-bottom:none}
.sk{font-size:9px;color:var(--tlo)}
.sv{font-size:10px;color:var(--thi);font-weight:600}
/* analysis */
.anb{width:100%;padding:9px;background:var(--gold);color:#060A12;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;margin-top:10px;font-family:monospace}
.anb:hover:not(:disabled){background:#FBBF24}
.anb:disabled{opacity:.35;cursor:not-allowed}
.aspin{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 9px}
.aph{font-size:10px;color:var(--gold);letter-spacing:1px;text-align:center}
.adot{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.abar{height:2px;background:var(--bg);border-radius:1px;overflow:hidden;margin-top:9px}
.abar-f{height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan),var(--gold));background-size:200% 100%;animation:grad 2s linear infinite}
@keyframes grad{to{background-position:-200% 0}}
.abox{text-align:center;padding:16px 0}
.afr{padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:5px;margin-bottom:10px}
.aft{font-size:8px;color:var(--cyan);margin-bottom:2px}
.afd{font-size:10px;color:var(--tlo);line-height:1.6}
.asct{font-size:10px;color:var(--gold);font-weight:700;margin:10px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.aln{font-size:11px;line-height:1.85;color:var(--text);margin:2px 0}
.ark{padding:4px 7px;background:var(--rnb);border:1px solid rgba(248,113,113,.2);border-radius:4px;margin:3px 0;font-size:11px;color:var(--text)}
.alv{display:flex;gap:6px;padding:3px 7px;background:var(--bg);border-radius:4px;margin:2px 0;font-size:11px;color:var(--text)}
.adc{padding:6px 8px;background:var(--gs);border:1px solid var(--gm);border-radius:4px;font-size:8px;color:var(--tlo);margin-top:9px;line-height:1.7}
.aerr{padding:10px;background:var(--rnb);border:1px solid var(--rbd);border-radius:6px;font-size:10px;color:var(--red);margin-bottom:9px;line-height:1.6}
@media(max-width:700px){.rp{display:none}}

<script>
// ── Config ────────────────────────────────────────────────────────────
let API_KEY = '';
const MODEL = 'claude-haiku-4-5-20251001';

// ── Constants ─────────────────────────────────────────────────────────
const OTC = new Set(['3105','3661','6488','6669','6770','8046','3045','3653','6415','5274','6550','3008','3533','6719','5347','2382','3034','4966','6104','3081']);
const DEFAULT_WL = [{t:'2330',m:'TW'},{t:'0050',m:'TW'},{t:'NVDA',m:'US'},{t:'TSM',m:'US'}];
const IND_DEFS = [
  {k:'sma5',l:'SMA 5',s:'5D'},{k:'sma20',l:'SMA 20',s:'20D'},
  {k:'rsi14',l:'RSI 14',s:'Momentum'},{k:'macd',l:'MACD',s:'DIF'},
  {k:'macdSig',l:'Signal',s:'DEA'},{k:'macdH',l:'Hist',s:'Histogram'},
  {k:'kdK',l:'KD-K',s:'Stoch K'},{k:'kdD',l:'KD-D',s:'Stoch D'},
  {k:'annVol',l:'Ann.Vol',s:'Volatility'},{k:'maxDD',l:'MaxDD',s:'Drawdown'},
  {k:'volRat',l:'VolRatio',s:'vs AvgVol'},{k:'d2s20',l:'vsSMA20',s:'Deviation'},
];
const PHASES = ['Fetching market data','Parsing financials','Comparing estimates','Reading technicals','Synthesizing signals','Writing Golem report'];
const SYS_PROMPT = `You are Golem AI, a professional stock analyst. Be precise, data-driven, and concise.
Write a report in Traditional Chinese. Begin DIRECTLY with section 一 — do NOT write any title or heading line.

一、市場概況 (Market Overview)
市場廣度和整體氛圍，量化數據。

二、[ticker] 主要分析
成交價、漲跌幅、相對強弱、成交量評價。

三、技術指標重點 (Technical Context)
RSI/MACD/KD 解讀，多空方向，關鍵信號。

四、風險提醒
- 風險一
- 風險二
- 風險三

五、可觀察的價位或事件
支撐：[價位]（原因）
壓力：[價位]（原因）
重要事件：[催化劑]

以上分析僅基於技術數據，不構成任何投資建議。`;

// ── Math ──────────────────────────────────────────────────────────────
const sma=(d,n)=>{const f=d.filter(v=>v!=null);return f.length<n?null:f.slice(-n).reduce((a,b)=>a+b,0)/n;};
const ema=(d,n)=>{if(!d.length)return[];const k=2/(n+1),r=[d[0]];for(let i=1;i<d.length;i++)r.push(d[i]*k+r[i-1]*(1-k));return r;};
function rsi(d,n=14){const f=d.filter(v=>v!=null);if(f.length<n+1)return 50;const g=[],l=[];for(let i=1;i<f.length;i++){const x=f[i]-f[i-1];g.push(x>0?x:0);l.push(x<0?-x:0);}let ag=g.slice(0,n).reduce((a,b)=>a+b,0)/n,al=l.slice(0,n).reduce((a,b)=>a+b,0)/n;for(let i=n;i<g.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;}return al===0?100:100-(100/(1+ag/al));}
function macd(d){const f=d.filter(v=>v!=null);if(f.length<35)return{m:0,s:0,h:0};const e12=ema(f,12),e26=ema(f,26),ml=e12.map((v,i)=>v-e26[i]).slice(25),sig=ema(ml,9),m=ml.at(-1)||0,s=sig.at(-1)||0;return{m,s,h:m-s};}
function kd(H,L,C,n=9){let k=50,d=50;const h=H.filter(v=>v!=null),l=L.filter(v=>v!=null),c=C.filter(v=>v!=null),len=Math.min(h.length,l.length,c.length);for(let i=n-1;i<len;i++){const hh=Math.max(...h.slice(i-n+1,i+1)),ll=Math.min(...l.slice(i-n+1,i+1)),rsv=hh===ll?50:(c[i]-ll)/(hh-ll)*100;k=k*2/3+rsv/3;d=d*2/3+k/3;}return{k,d};}
function aVol(d){const f=d.filter(v=>v!=null);if(f.length<20)return 0;const r=f.slice(-20).map((v,i,a)=>i?Math.log(v/a[i-1]):0).slice(1),m=r.reduce((a,b)=>a+b,0)/r.length;return Math.sqrt(r.map(x=>(x-m)**2).reduce((a,b)=>a+b,0)/r.length)*Math.sqrt(252);}
function mdd(d){const f=d.filter(v=>v!=null);if(!f.length)return 0;let pk=f[0],mx=0;for(const v of f){if(v>pk)pk=v;const dd=(pk-v)/pk;if(dd>mx)mx=dd;}return mx;}
const fmtV=(v,m)=>{if(!v)return'--';if(m==='TW')return(v/10000).toFixed(1)+'W';if(v>1e9)return(v/1e9).toFixed(2)+'B';if(v>1e6)return(v/1e6).toFixed(2)+'M';return v.toLocaleString();};
const ySym=(t,m)=>m==='US'?t:OTC.has(t)?t+'.TWO':t+'.TW';

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── API key ───────────────────────────────────────────────────────────
function onApiKeyChange(v){
  API_KEY=v.trim();
  const el=document.getElementById('apiStatus');
  if(!API_KEY){el.className='api-status none';el.textContent='未設定';}
  else if(API_KEY.startsWith('sk-ant-')){el.className='api-status ok';el.textContent='已設定';}
  else{el.className='api-status err';el.textContent='格式錯誤';}
}

// ── Yahoo Finance ─────────────────────────────────────────────────────
async function fetchYahoo(t,m){
  // For TW stocks: try both .TW (TWSE) and .TWO (TPEX) automatically
  const syms=m==='TW'?[t+'.TW',t+'.TWO']:[t];
  for(const sym of syms){
    // Check sessionStorage cache (5-min TTL)
    const ck='yf_'+sym, cached=sessionStorage.getItem(ck);
    if(cached){try{const c=JSON.parse(cached);if(Date.now()-c.ts<300000)return c.data;}catch{}}
    // 1) Local proxy via server.py
    try{
      const r=await fetch('/yf/'+sym,{signal:AbortSignal.timeout(12000)});
      if(r.ok){
        const j=await r.json();
        if(j?.chart?.result?.[0]){
          try{sessionStorage.setItem(ck,JSON.stringify({ts:Date.now(),data:j.chart.result[0]}));}catch{}
          return j.chart.result[0];
        }
      }
    }catch(e){console.info('local proxy unavailable, trying allorigins');}
    // 2) allorigins.win fallback
    for(const base of['query1','query2']){
      const url='https://'+base+'.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=3mo';
      const p='https://api.allorigins.win/get?url='+encodeURIComponent(url);
      try{
        const r=await fetch(p,{signal:AbortSignal.timeout(20000)});
        if(!r.ok)continue;
        const raw=await r.json();
        if(typeof raw.contents!=='string')continue;
        const j=JSON.parse(raw.contents);
        if(j?.chart?.result?.[0]){
          try{sessionStorage.setItem(ck,JSON.stringify({ts:Date.now(),data:j.chart.result[0]}));}catch{}
          return j.chart.result[0];
        }
      }catch(e){console.warn('allorigins fail',sym,e.message);}
    }
  }
  return null;
}

function buildStock(ch,t,m){
  const meta=ch.meta||{},q=ch.indicators?.quote?.[0]||{},ts=ch.timestamp||[];
  const C=(q.close||[]),H=(q.high||[]),L=(q.low||[]),V=(q.volume||[]);
  const Cf=C.filter(v=>v!=null);
  if(!Cf.length)return null;
  const px=meta.regularMarketPrice||Cf.at(-1)||0,pv=meta.chartPreviousClose||Cf.at(-2)||px;
  const chg=pv?((px-pv)/pv*100):0,vol=(V.filter(v=>v!=null)).at(-1)||0;
  const Vf=V.filter(v=>v!=null),avg=Vf.slice(-20).reduce((a,b)=>a+b,0)/Math.max(Vf.slice(-20).length,1);
  const s20=sma(Cf,20)||px,mc=macd(Cf),kd_=kd(H.filter(v=>v!=null),L.filter(v=>v!=null),Cf);
  // Build OHLCV for chart (LightweightCharts format, time in seconds)
  const ohlcv=ts.map((t2,i)=>({time:t2,open:q.open?.[i],high:q.high?.[i],low:q.low?.[i],close:q.close?.[i],volume:q.volume?.[i]}))
    .filter(d=>d.open!=null&&d.high!=null&&d.low!=null&&d.close!=null&&d.close>0);
  return{t,m,name:meta.longName||meta.shortName||t,
    px:px.toFixed(2),cur:m==='TW'?'TWD':'USD',
    chg:(chg>=0?'+':'')+chg.toFixed(2)+'%',chgN:chg,
    vol:fmtV(vol,m),pv:pv.toFixed(2),h52:(meta['52WeekHigh']||0).toFixed(2),l52:(meta['52WeekLow']||0).toFixed(2),
    ts:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',hour12:false}),
    ohlcv,
    ind:{
      sma5:sma(Cf,5)?.toFixed(2)||'--',sma20:s20?.toFixed(2)||'--',
      rsi14:rsi(Cf,14).toFixed(1),
      macd:mc.m.toFixed(4),macdSig:mc.s.toFixed(4),macdH:mc.h.toFixed(4),
      kdK:kd_.k.toFixed(1),kdD:kd_.d.toFixed(1),
      annVol:(aVol(Cf)*100).toFixed(1)+'%',maxDD:(mdd(Cf)*100).toFixed(1)+'%',
      volRat:(avg>0?vol/avg:1).toFixed(2)+'x',
      d2s20:((px/s20-1)*100>=0?'+':'')+((px/s20-1)*100).toFixed(1)+'%'
    }};
}

// ── Anthropic API ─────────────────────────────────────────────────────
async function callClaude(system, userMsg){
  if(!API_KEY)throw new Error('請先在上方輸入 Anthropic API Key');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    signal:AbortSignal.timeout(60000),
    headers:{
      'Content-Type':'application/json',
      'x-api-key':API_KEY,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:MODEL,max_tokens:1500,system,messages:[{role:'user',content:userMsg}]})
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({error:{message:'HTTP '+res.status}}));
    throw new Error(err?.error?.message||'API error '+res.status);
  }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  if(!text.trim())throw new Error('API returned empty response (stop_reason: '+(data.stop_reason||'?')+')');
  return text;
}

// ── State ─────────────────────────────────────────────────────────────
const S={wl:[...DEFAULT_WL],data:{},loading:new Set(),failed:new Set(),sel:null,tab:'stats',busy:false,aText:'',aPhase:'',addT:'',addM:'TW'};
let phaseT=null,_lwChart=null,_lastChartKey='';

function renderChart(sel,data){
  const key=sel?(sel.t+':'+(data[sel.t]?.ohlcv?.length||0)):'';
  if(key===_lastChartKey)return;
  _lastChartKey=key;
  const el=document.getElementById('Z-cc');
  if(_lwChart){try{_lwChart.remove();}catch{}; _lwChart=null;}
  if(!sel){el.innerHTML='<div class="hint">Select a stock to view chart</div>';return;}
  const sd=data[sel.t];
  if(!sd?.ohlcv?.length){el.innerHTML='<div class="hint" style="padding-top:48px">Loading chart...</div>';return;}
  el.innerHTML='';
  const h=el.clientHeight||400,w=el.clientWidth||800;
  if(typeof LightweightCharts==='undefined'){el.innerHTML='<div class="hint">Loading chart library...</div>';return;}
  _lwChart=LightweightCharts.createChart(el,{
    width:w,height:h,
    layout:{background:{type:'solid',color:'#060A12'},textColor:'#5A6A82'},
    grid:{vertLines:{color:'#0D1824'},horzLines:{color:'#0D1824'}},
    crosshair:{mode:1},
    rightPriceScale:{borderColor:'#1A2740',scaleMargins:{top:0.1,bottom:0.2}},
    timeScale:{borderColor:'#1A2740',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true,
  });
  const cs=_lwChart.addCandlestickSeries({
    upColor:'#4ADE80',downColor:'#F87171',
    borderUpColor:'#4ADE80',borderDownColor:'#F87171',
    wickUpColor:'#4ADE80',wickDownColor:'#F87171',
  });
  cs.setData(sd.ohlcv.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
  // Volume histogram in lower pane
  const vs=_lwChart.addHistogramSeries({
    color:'rgba(96,165,250,0.3)',priceFormat:{type:'volume'},
    priceScaleId:'vol',
  });
  _lwChart.priceScale('vol').applyOptions({scaleMargins:{top:0.8,bottom:0},borderVisible:false});
  vs.setData(sd.ohlcv.filter(d=>d.volume!=null).map(d=>({time:d.time,value:d.volume,color:d.close>=d.open?'rgba(74,222,128,0.25)':'rgba(248,113,113,0.25)'})));
  _lwChart.timeScale().fitContent();
  // Resize observer
  if(window._chartRO)window._chartRO.disconnect();
  window._chartRO=new ResizeObserver(()=>{if(_lwChart)_lwChart.applyOptions({width:el.clientWidth,height:el.clientHeight});});
  window._chartRO.observe(el);
}
function set(patch){Object.assign(S,typeof patch==='function'?patch(S):patch);render();}

// ── Data ops ──────────────────────────────────────────────────────────
async function load(t,m){
  const f0=new Set(S.failed);f0.delete(t);
  set(s=>({loading:new Set([...s.loading,t]),failed:f0}));
  let stock=null;
  try{
    const ch=await fetchYahoo(t,m);
    if(ch)try{stock=buildStock(ch,t,m);}catch(e){console.error('buildStock',e);}
  }catch(e){console.error('fetchYahoo',e);}
  set(s=>{
    const l=new Set(s.loading);l.delete(t);
    const f=new Set(s.failed);
    if(stock)f.delete(t);else f.add(t);
    return stock?{loading:l,failed:f,data:{...s.data,[t]:stock}}:{loading:l,failed:f};
  });
}
function loadAll(){S.wl.forEach((w,i)=>setTimeout(()=>load(w.t,w.m),i*3000));}

function addStock(){
  const t=S.addT.trim().toUpperCase();
  if(!t||S.wl.find(w=>w.t===t&&w.m===S.addM))return;
  set(s=>({wl:[...s.wl,{t,m:S.addM}],addT:'',sel:{t,m:S.addM},tab:'stats'}));
  load(t,S.addM);
}
function del(t,m){set(s=>{const wl=s.wl.filter(w=>!(w.t===t&&w.m===m));const data={...s.data};delete data[t];return{wl,data,sel:s.sel?.t===t?null:s.sel};});}
function pick(t,m){set({sel:{t,m},tab:'stats'});}

async function analyse(){
  if(!S.sel||S.busy)return;
  set({busy:true,aText:'',tab:'analysis'});
  let pi=0;clearInterval(phaseT);
  phaseT=setInterval(()=>{pi=(pi+1)%PHASES.length;set({aPhase:PHASES[pi]});},3500);
  set({aPhase:PHASES[0]});

  const{sel,data:D,wl}=S;
  const d=D[sel.t];
  const arr=wl.map(w=>D[w.t]).filter(Boolean);
  const up=arr.filter(x=>x.chgN>0).length,dn=arr.filter(x=>x.chgN<0).length;
  const avg=arr.length?arr.reduce((s,x)=>s+x.chgN,0)/arr.length:0;
  const wls=wl.map(w=>{const x=D[w.t];return x?x.t+':'+x.px+x.cur+' '+x.chg:w.t+':N/A';}).join(' | ');
  const inds=d?Object.entries(d.ind).map(([k,v])=>k+'='+v).join(' '):'-';
  const msg='Target: '+sel.t+'('+sel.m+')'+(d?'\nCompany: '+d.name+'\nPrice:'+d.px+d.cur+' Chg:'+d.chg+'\nVol:'+d.vol+' 52W:'+d.l52+'-'+d.h52+'\n'+inds:'')
    +'\nWatchlist: '+wls+'\nBreadth: up='+up+' dn='+dn+' avg='+(avg>=0?'+':'')+avg.toFixed(2)+'%';
  try{
    const txt=await callClaude(SYS_PROMPT,msg);
    clearInterval(phaseT);
    // Title is set by JS directly from Yahoo Finance data — AI never touches it
    const header=d?'TITLE:'+d.name+' ('+sel.t+')\n':'';
    set({aText:header+txt,busy:false,tab:'analysis'});
  }catch(e){
    clearInterval(phaseT);
    set({aText:'ERR:'+e.message,busy:false,tab:'analysis'});
  }
}

// ── Render analysis ───────────────────────────────────────────────────
function renderA(text){
  try{
    const t=String(text??'');
    if(!t.trim())return '<div class="re">Select a stock and click Golem Analysis</div>';
    if(t.startsWith('ERR:'))return '<div class="aerr">'+esc(t.slice(4))+'</div><button class="anb" onclick="analyse()">Retry</button>';

    // Extract title set by JS (never from AI)
    let titleHtml='',body=t;
    if(t.startsWith('TITLE:')){
      const nl=t.indexOf('\n');
      const titleStr=t.slice(6,nl>0?nl:undefined);
      titleHtml='<div class="st" style="font-size:15px;margin-bottom:2px">'+esc(titleStr)+'</div>'
               +'<div style="height:1px;background:var(--border);margin-bottom:8px"></div>';
      body=nl>0?t.slice(nl+1):'';
    }

    let inR=false,inL=false;
    const rows=body.split('\n').map(line=>{
      // Strip any AI-generated title lines (# heading) — title is already set by JS above
      if(/^#+\s/.test(line))return '';
      const sec=/^(一|二|三|四|五)[、．.]/.test(line);
      const disc=line.includes('不構成任何投資建議')||line.includes('investment advice');
      if(line.includes('四、'))inR=true;
      if(line.includes('五、')){inR=false;inL=true;}
      if(sec)return '<div class="asct">'+esc(line)+'</div>';
      if(disc)return '<div class="adc">'+esc(line)+'</div>';
      if(!line.trim())return '<div style="height:4px"></div>';
      if(inR&&/^[-•*]/.test(line))return '<div class="ark">'+esc(line.replace(/^[-•*]\s*/,''))+'</div>';
      if(inL&&/^(支撐|壓力|重要事件)/.test(line)){
        const c=/支撐/.test(line)?"var(--green)":/壓力/.test(line)?"var(--red)":"var(--blue)";
        const bg=/支撐/.test(line)?"var(--gnb)":/壓力/.test(line)?"var(--rnb)":"var(--bnb)";
        const tag=/支撐/.test(line)?'支撐':/壓力/.test(line)?'壓力':'事件';
        return '<div class="alv"><span style="font-size:8px;padding:2px 5px;border-radius:2px;background:'+bg+';color:'+c+';flex-shrink:0">'+tag+'</span>'+esc(line.replace(/^[^：:]+[：:]\s*/,''))+'</div>';
      }
      return '<div class="aln">'+esc(line)+'</div>';
    }).join('');
    return '<div>'
      +'<div class="afr"><div class="aft">Analysis complete</div><div class="afd">'+new Date().toLocaleString()+' · '+MODEL+'</div></div>'
      +titleHtml+rows
      +'<button class="anb" style="margin-top:10px" onclick="analyse()">Re-analyze</button></div>';
  }catch(e){return '<div class="aerr">Render error: '+esc(e.message)+'</div>';}
}

// ── Helpers ───────────────────────────────────────────────────────────
function cls(n){return n>0?'up':n<0?'dn':'flat';}
function icls(k,v){
  if(!v)return'';
  if(k==='rsi14'){const n=parseFloat(v);return n>=70?'warn':n<=30?'dn':'';}
  if(k==='macd'||k==='macdH')return parseFloat(v)>=0?'up':'dn';
  if(k==='d2s20')return v.startsWith('+')?'up':v.startsWith('-')?'dn':'';
  if(k==='kdK'){const n=parseFloat(v);return n>=80?'warn':n<=20?'info':'';}
  return'';
}

// ── Render ────────────────────────────────────────────────────────────
function render(){
  const{wl,data:D,loading,failed,sel,tab,busy,aText,aPhase,addT,addM}=S;
  const arr=wl.map(w=>D[w.t]).filter(Boolean);
  const up=arr.filter(x=>x.chgN>0).length,dn=arr.filter(x=>x.chgN<0).length;
  const avg=arr.length?arr.reduce((s,x)=>s+x.chgN,0)/arr.length:0;
  const sd=sel?D[sel.t]:null;

  // Top
  try{document.getElementById('Z-top').innerHTML=
    '<span style="font-size:16px">🍌</span>'
    +'<span class="logo">GOLEM TERMINAL</span>'
    +'<div class="bd"><span class="bup">+'+up+'</span><span class="bsep">/</span><span class="bdn">-'+dn+'</span><span class="bsep">/</span>'
    +'<span style="color:'+(avg>=0?'var(--green)':'var(--red)')+';font-weight:700">'+(avg>=0?'+':'')+avg.toFixed(2)+'%</span></div>'
    +'<div class="sp"></div><div class="pl"></div>'
    +'<button class="btn" onclick="loadAll()">Refresh</button>'
    +'<button class="btn gold" onclick="analyse()" '+(!sel||busy?'disabled':'')+'>'+( busy?'...':'Golem')+'</button>';
  }catch(e){console.error('top err',e);}

  // Add bar
  try{document.getElementById('Z-add').innerHTML=
    '<span style="font-size:9px;color:var(--gold);font-weight:700">+ ADD</span>'
    +'<input class="sym-input" value="'+esc(addT)+'" oninput="S.addT=this.value" onkeydown="if(event.key===\'Enter\')addStock()" placeholder="2330 / SNPS" maxlength="10">'
    +'<select class="mkt-sel" onchange="S.addM=this.value"><option value="TW"'+(addM==='TW'?' selected':'')+'>TW</option><option value="US"'+(addM==='US'?' selected':'')+'>US</option></select>'
    +'<button class="add-btn" onclick="addStock()">+ Add</button>';
  }catch(e){console.error('add-bar err',e);}

  // Watchlist
  try{document.getElementById('Z-wl').innerHTML=wl.map(w=>{
    const d=D[w.t],ld=loading.has(w.t),ac=sel?.t===w.t&&sel?.m===w.m;
    const c=d?cls(d.chgN):'';
    return'<div class="wi'+(ac?' act':'')+'" onclick="pick(\''+w.t+'\',\''+w.m+'\')">'
      +'<span class="wm '+w.m.toLowerCase()+'">'+w.m+'</span>'
      +'<span class="wt">'+w.t+'</span>'
      +'<span class="wpx">'+(ld?'<span class="spin"></span>':(d?d.px:'--'))+'</span>'
      +'<span class="wch '+c+'">'+(d?d.chg:'--')+'</span>'
      +'<button class="wdel" onclick="event.stopPropagation();del(\''+w.t+'\',\''+w.m+'\')">x</button></div>';
  }).join('');
  }catch(e){console.error('watchlist err',e);}

  // Chart header
  try{document.getElementById('Z-ch').innerHTML=sel
    ?'<span class="ck">'+sel.t+'</span><span class="cn">'+esc(sd?.name||'loading...')+'</span>'
     +'<span style="margin-left:auto" class="cpx">'+(sd?sd.px+' '+sd.cur:'')+'</span>'
     +'<span class="cch '+(sd?cls(sd.chgN):'')+'">'+(sd?.chg||'')+'</span>'
    :'<span class="ck">--</span><span class="cn">Select a stock</span>';
  }catch(e){console.error('chart-header err',e);}

  // Chart
  try{renderChart(sel,D);}catch(e){console.error('chart err',e);}

  // Indicators bar (always renders — independent of chart)
  try{document.getElementById('Z-ig').innerHTML=IND_DEFS.map(def=>{
    const raw=sd?.ind?.[def.k];
    return'<div class="ic"><div class="il">'+def.l+'</div><div class="iv '+icls(def.k,raw)+'">'+(raw||'--')+'</div><div class="is">'+def.s+'</div></div>';
  }).join('');
  }catch(e){console.error('indicators err',e);}

  // Right tabs — always renders regardless of chart/indicator state
  try{document.getElementById('Z-rt').innerHTML=
    '<div class="rtb '+(tab==='stats'?'act':'')+'" onclick="set({tab:\'stats\'})">Stats</div>'
    +'<div class="rtb '+(tab==='analysis'?'act':'')+'" onclick="set({tab:\'analysis\'})">Golem AI</div>';
  }catch(e){console.error('tabs err',e);}

  // Right body — always renders
  try{
    if(tab==='stats'){
      if(!sel){
        document.getElementById('Z-rb').innerHTML='<div class="re">點選左側個股查看詳情</div>';
      } else {
        const isFail=failed.has(sel.t),isLoad=loading.has(sel.t);
        let inner='';
        if(sd){
          inner='<div class="st">'+sd.t+'</div><div class="sn">'+esc(sd.name)+'</div>'
           +'<div class="spr"><span class="sp2">'+sd.px+'</span><span class="scr">'+sd.cur+'</span>'
           +'<span class="sbg '+sd.m.toLowerCase()+'">'+( sd.m==='TW'?'台股':'US Stock')+'</span></div>'
           +'<div class="sch '+cls(sd.chgN)+'">'+sd.chg+'</div>'
           +[['Prev Close',sd.pv+' '+sd.cur],['52W H/L',sd.h52+'/'+sd.l52],['Volume',sd.vol],['Updated',sd.ts]]
             .map(([k,v])=>'<div class="sr"><span class="sk">'+k+'</span><span class="sv">'+v+'</span></div>').join('');
        } else if(isLoad){
          inner='<div class="re">載入中...<br><span class="spin" style="width:14px;height:14px;border-width:2px"></span></div>';
        } else if(isFail){
          inner='<div style="padding:10px;background:var(--rnb);border:1px solid var(--rbd);border-radius:6px;font-size:9px;color:var(--red);margin-bottom:10px;line-height:1.7">'
           +'⚠ 價格資料載入失敗<br><span style="color:var(--tlo)">Yahoo Finance proxy 無法連線。分析將使用有限資訊執行。</span></div>'
           +'<button class="btn" style="margin-bottom:8px;width:100%;text-align:center" onclick="load(\''+sel.t+'\',\''+sel.m+'\')" >Retry</button>';
        } else {
          inner='<div class="re">'+sel.t+' 無資料</div>';
        }
        inner+='<button class="anb" onclick="analyse()" '+(busy||isLoad?'disabled':'')+'>'+( busy?'Analyzing...':'Golem Analysis')+'</button>';
        document.getElementById('Z-rb').innerHTML=inner;
      }
    }else{
      document.getElementById('Z-rb').innerHTML=busy
        ?'<div class="abox"><div class="aspin"></div><div class="aph">'+esc(aPhase)+'<span class="adot">...</span></div>'
         +'<div style="font-size:8px;color:var(--tf);margin-top:5px">'+MODEL+' · ~15-30s</div>'
         +'<div class="abar"><div class="abar-f"></div></div></div>'
        :renderA(aText);
    }
  }catch(e){console.error('right-panel err',e);}
}

render();
loadAll();
</script>
