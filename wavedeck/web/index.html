<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WaveDeck · 浪潮執行台</title>
  <link rel="stylesheet" href="/css/deck.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="brandbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">WD</div>
        <div>
          <h1>WaveDeck <span>× ST</span></h1>
          <p>浪潮執行台 · 判斷／閘門／橋接</p>
        </div>
      </div>
      <div class="brand-meta">
        <span>時間 <strong id="clock">—</strong></span>
        <span>FSM <strong id="fsm">—</strong></span>
        <span>模式 <strong id="mode">paper</strong></span>
        <span>TV <strong id="lastTv">—</strong></span>
      </div>
    </header>

    <section class="status-row">
      <div class="panel thin">
        <div class="panel-hd"><h2>Webhook</h2></div>
        <div class="panel-bd">
          <div class="chip-row">
            <span class="chip info"><i class="dot"></i><b id="webhookStatus">待命</b></span>
            <span class="chip"><i class="dot"></i><b id="transport">—</b></span>
          </div>
        </div>
      </div>
      <div class="panel thin">
        <div class="panel-hd"><h2>健康</h2></div>
        <div class="panel-bd chip-row" id="healthChips"></div>
      </div>
      <div class="panel thin">
        <div class="panel-hd"><h2>ST 覆寫</h2></div>
        <div class="panel-bd">
          <div class="chip-row">
            <span class="chip"><i class="dot"></i>降載 <b id="stDelever">否</b></span>
            <span class="chip"><i class="dot"></i>風格 <b id="stStyle">—</b></span>
          </div>
          <p class="summary one-line" id="stNote">等待 ST 宏觀參數。</p>
        </div>
      </div>
    </section>

    <section class="deck-grid">
      <aside class="panel">
        <div class="panel-hd"><h2>部位</h2></div>
        <div class="panel-bd">
          <div class="kv" id="posKv"></div>
          <div class="slider-wrap">
            <div class="panel-hd sub"><h2>進場風格</h2></div>
            <div class="slider-labels"><span>35</span><span>50</span><span>65</span></div>
            <input id="styleRange" type="range" min="20" max="90" step="1" value="50" />
            <div class="style-readout">
              <span class="lab">當前</span>
              <strong id="styleVal">50</strong>
            </div>
          </div>
          <div class="guard" id="noOvernight">
            <h3>不留倉 · 啟用</h3>
            <p>收盤前禁新單；指定時間強平。</p>
          </div>
        </div>
      </aside>

      <section class="panel ai-panel">
        <div class="panel-hd"><h2>AI 判斷</h2><span class="tag" id="aiEvent">—</span></div>
        <div class="panel-bd">
          <div class="ai-hero">
            <div class="ai-action">
              <div class="lbl" id="aiLabel">—</div>
              <div class="pct" id="aiConf">—</div>
            </div>
          </div>
          <div class="bias">
            <div class="b long"><span class="k">偏多</span><em id="biasLong">—</em></div>
            <div class="b short"><span class="k">偏空</span><em id="biasShort">—</em></div>
          </div>
          <p class="summary clamp" id="aiSummary">—</p>
          <div class="tags" id="aiTags"></div>
          <div class="process" id="aiProcess"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-hd"><h2>燈號</h2></div>
        <div class="panel-bd">
          <div class="lights" id="lights"></div>
          <div class="panel-hd sub"><h2>帳戶</h2></div>
          <div class="acct" id="acct"></div>
        </div>
      </aside>

      <aside class="panel side-stack">
        <div class="panel-hd"><h2>執行 · 成本</h2></div>
        <div class="panel-bd">
          <div class="kv" id="execKv"></div>
          <div class="acct compact" id="costKv"></div>
          <div class="panel-hd sub"><h2>傳輸</h2></div>
          <p class="summary one-line" id="transportBlurb">Webhook · 本機 127.0.0.1</p>
          <div class="kv" id="transportKv"></div>
        </div>
      </aside>
    </section>

    <footer class="panel controls">
      <span class="group-label">DECISION</span>
      <label class="ctrl-select">
        <span>源</span>
        <select id="providerSelect" aria-label="決策提供者">
          <option value="heuristic">Heuristic</option>
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI</option>
        </select>
      </label>
      <button class="btn" id="btnModePaper" type="button">paper</button>
      <button class="btn" id="btnModeLive" type="button">live/TXT</button>
      <button class="btn" id="btnSyncTxt" type="button">同步 TXT</button>

      <span class="group-label">SYS</span>
      <button class="btn primary" data-cmd="start">啟動</button>
      <button class="btn" data-cmd="stop">停止</button>
      <button class="btn" data-cmd="restart">重啟</button>
      <button class="btn" data-cmd="refresh">重整</button>
      <button class="btn primary" id="btnDemo">模擬 TV</button>

      <span class="group-label">VIEW</span>
      <button class="btn ghost" id="btnAudit">稽核</button>
      <button class="btn ghost" id="btnOpenST">開 ST</button>

      <span class="group-label">KILL</span>
      <button class="btn danger" id="btnKill">緊急 ON</button>
      <button class="btn" id="btnKillOff">解除</button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/deck.js"></script>
</body>
</html>
